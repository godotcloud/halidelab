              private func triggerShutterWithOptionalTimer() {
                  let delaySec = renderEngine.selfTimerSeconds
                  if delaySec <= 0 {
                      executeImmediateShutterCapture()
                  } else {
                      countdownRemaining = delaySec
                      Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true) { timer in
                          motionAndHaptics.playApertureDetentClick()
                          if countdownRemaining > 1 {
                              countdownRemaining -= 1
                          } else {
                              timer.invalidate()
                              countdownRemaining = 0
                              executeImmediateShutterCapture()
                          }
                      }
                  }
              }
          
              private func executeImmediateShutterCapture() {
                  withAnimation(.easeOut(duration: 0.08)) {
                      shutterFlashOpacity = 0.85
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.10) {
                      withAnimation(.easeIn(duration: 0.18)) {
                          shutterFlashOpacity = 0.0
                      }
                  }
                  let recipe = renderEngine.buildCurrentRecipe()
                  let snapshot = renderEngine.snapshotCurrentPrintUIImage()
                  cameraPipeline.capture12BitRAWAndDevelopPrint(
                      recipe: recipe,
                      filmName: renderEngine.selectedFilm.displayName,
                      paperName: renderEngine.selectedPaper.displayName,
                      renderedPrintSnapshot: snapshot
                  )
              }
          
