              /// 100% Crash-Proof Direct Metal Print Capture & Archiving:
              /// Captures directly from the dedicated GPU render buffer without calling `AVCapturePhotoOutput`
              /// (preventing all Objective-C NSInvalidArgumentException crashes) and saves both to iOS Photos and In-App Contact Sheet.
              func capture12BitRAWAndDevelopPrint(
                  recipe: DarkroomNegativeRecipe,
                  filmName: String,
                  paperName: String,
                  renderedPrintSnapshot: UIImage?
              ) {
                  MechanicalHapticsAndMotion.shared.playMechanicalShutterRelease(shutterDurationSeconds: Double(recipe.shutterSpeedSeconds))
          
                  guard let printImg = renderedPrintSnapshot else {
                      showSaveToast("Frame buffer warming up — tap shutter again")
                      return
                  }
          
                  let newFrame = CapturedAnalogFrame(
                      id: recipe.id,
                      timestamp: recipe.captureTimestamp,
                      printImage: printImg,
                      recipe: recipe,
                      filmName: filmName,
                      paperName: paperName,
                      lensName: activeLens.rawValue
                  )
          
                  DispatchQueue.main.async {
                      self.latestCapturedPreviewImage = printImg
                      self.capturedRollsCount += 1
                      self.capturedFramesGallery.insert(newFrame, at: 0)
                  }
          
                  saveDevelopedPrintAndRecipeToPhotoLibrary(printImage: printImg, recipe: recipe, filmName: filmName)
              }
          
              private func showSaveToast(_ text: String) {
                  DispatchQueue.main.async {
                      self.saveToastMessage = text
                      DispatchQueue.main.asyncAfter(deadline: .now() + 2.5) {
                          if self.saveToastMessage == text {
                              self.saveToastMessage = nil
                          }
                      }
                  }
              }
          
              func saveDevelopedPrintAndRecipeToPhotoLibrary(printImage: UIImage, recipe: DarkroomNegativeRecipe, filmName: String) {
                  // 1. Always save JPEG Print + Non-Destructive JSON Recipe to App Documents directory
                  DispatchQueue.global(qos: .userInitiated).async { [weak self] in
                      guard let self = self else { return }
                      guard let jpegData = printImage.jpegData(compressionQuality: 0.96) else {
                          self.showSaveToast("✓ Saved to In-App Contact Sheet")
                          return
                      }
          
                      if let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first {
                          let sidecarURL = docs.appendingPathComponent("Recipe_\(recipe.id.uuidString).json")
                          if let jsonData = try? JSONEncoder().encode(recipe) {
                              try? jsonData.write(to: sidecarURL, options: .atomic)
                          }
                          let imgURL = docs.appendingPathComponent("Print_\(recipe.id.uuidString).jpg")
                          try? jpegData.write(to: imgURL, options: .atomic)
                      }
          
                      // 2. Save to iOS System Photo Library with safe authorization check
                      PHPhotoLibrary.requestAuthorization(for: .addOnly) { status in
                          guard status == .authorized || status == .limited else {
                              self.showSaveToast("✓ Saved to Contact Sheet (Enable Photos Access in Settings)")
                              return
                          }
                          PHPhotoLibrary.shared().performChanges({
                              let creationRequest = PHAssetCreationRequest.forAsset()
                              creationRequest.addResource(with: .photo, data: jpegData, options: nil)
                          }) { success, _ in
                              if success {
                                  self.showSaveToast("✓ Saved \(filmName) Print to iOS Photos & Roll")
                              } else {
                                  self.showSaveToast("✓ Saved to In-App Contact Sheet Roll")
                              }
                          }
                      }
                  }
              }
          
              private func pollHardwareExposureTelemetry() {
                  guard let device = videoDeviceInput?.device else { return }
                  let currentISO: Float = device.iso
                  let currentSec: Float = Float(CMTimeGetSeconds(device.exposureDuration))
                  if currentSec > 0.0 && !currentSec.isNaN {
                      DispatchQueue.main.async {
                          self.liveHardwareISO = currentISO
                          self.liveHardwareShutterSeconds = currentSec
                      }
                  }
              }
          }
          
          extension CameraCapturePipeline: AVCaptureVideoDataOutputSampleBufferDelegate {
              func captureOutput(
                  _ output: AVCaptureOutput,
                  didOutput sampleBuffer: CMSampleBuffer,
                  from connection: AVCaptureConnection
              ) {
                  guard let pixelBuffer = CMSampleBufferGetImageBuffer(sampleBuffer) else { return }
                  updateCameraMetalTexture(from: pixelBuffer)
                  pollHardwareExposureTelemetry()
              }
          
              private func updateCameraMetalTexture(from pixelBuffer: CVPixelBuffer) {
                  guard let cache = textureCache else { return }
                  let width = CVPixelBufferGetWidth(pixelBuffer)
                  let height = CVPixelBufferGetHeight(pixelBuffer)
                  var cvTexOut: CVMetalTexture?
                  let status = CVMetalTextureCacheCreateTextureFromImage(
                      kCFAllocatorDefault,
                      cache,
                      pixelBuffer,
                      nil,
                      .bgra8Unorm,
                      width,
                      height,
                      0,
                      &cvTexOut
                  )
                  if status == kCVReturnSuccess, let cvTex = cvTexOut, let mtlTex = CVMetalTextureGetTexture(cvTex) {
                      textureLock.lock()
                      _latestCameraTexture = mtlTex
                      textureLock.unlock()
                  }
              }
