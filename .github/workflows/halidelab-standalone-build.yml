          inline float3 applyWrattenOpticalFilter(float3 linearRGB, int32_t filterType) {
              switch (filterType) {
                  case OpticalGlassFilterYellowK2:  // Wratten #8 Yellow K2
                      return linearRGB * float3(1.18f, 1.12f, 0.38f);
                  case OpticalGlassFilterOrangeG15: // Wratten #15 Deep Orange
                      return linearRGB * float3(1.38f, 0.90f, 0.12f);
                  case OpticalGlassFilterRed25:     // Wratten #25A Red Tricolor
                      return linearRGB * float3(1.85f, 0.18f, 0.04f);
                  case OpticalGlassFilterGreenX1:   // Wratten #11 Yellow-Green
