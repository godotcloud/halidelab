          /// Represents an authentic real-world film emulsion digitized from manufacturer technical data sheets.
          struct FilmStockDescriptor: Identifiable, Hashable {
              let id: String
              let displayName: String
              let manufacturer: String
              let codeName: String
              let datasheetReference: String
              let processType: FilmProcessType
              let grainMorphology: GrainMorphologyType
              let nominalISO: Float
              let nativeWhiteBalanceK: Int
              let defaultDeveloperName: String
              let defaultDeveloperTempC: Float
              
              // H-D Curve Parameters (Red/Cyan, Green/Magenta, Blue/Yellow)
              let dMinRGB: SIMD3<Float>
              let dMaxRGB: SIMD3<Float>
              let gammaRGB: SIMD3<Float>
              let logH0RGB: SIMD3<Float>
              let toeCurvatureRGB: SIMD3<Float>
              let shoulderCurvatureRGB: SIMD3<Float>
              
              // Schwarzschild Reciprocity Failure Exponent p (H_eff = E * t^p)
              let reciprocityExponentRGB: SIMD3<Float>
              
              // Spectral Sensitivity Cross-Talk & DIR Couplers Inter-Image Matrix
              let spectralRow0: SIMD3<Float>
              let spectralRow1: SIMD3<Float>
              let spectralRow2: SIMD3<Float>
              let dirCouplerRow0: SIMD3<Float>
              let dirCouplerRow1: SIMD3<Float>
              let dirCouplerRow2: SIMD3<Float>
              
              // Halation & Microstructure
              let halationReflectance: Float
              let halationGreenLeak: Float
              let halationThreshold: Float
              let halationRadiusPixels: Float
              let diffuseRMSGranularity: Float // Official Diffuse RMS Granularity (sigma_D * 1000 at D=1.0, 48um aperture)
              let eberhardEdgeBoost: Float
              let mtf50CyclesPerMM: Float
          
              func buildUniforms(
                  ratedEI: Float,
                  shutterSeconds: Float,
                  devTempC: Float,
                  devTimeScale: Float,
                  agitation: Float,
                  frameSeed: UInt32
              ) -> FilmEmulsionUniforms {
                  var u = FilmEmulsionUniforms()
                  u.processType = processType.rawValue
                  u.grainMorphology = grainMorphology.rawValue
                  u.isoNominal = nominalISO
                  u.exposureIndexRated = ratedEI
                  u.exposureTimeSeconds = shutterSeconds
                  u.reciprocityExponentRGB = (reciprocityExponentRGB.x, reciprocityExponentRGB.y, reciprocityExponentRGB.z)
                  u.dMinRGB = (dMinRGB.x, dMinRGB.y, dMinRGB.z)
                  u.dMaxRGB = (dMaxRGB.x, dMaxRGB.y, dMaxRGB.z)
                  u.gammaRGB = (gammaRGB.x, gammaRGB.y, gammaRGB.z)
                  u.logH0RGB = (logH0RGB.x, logH0RGB.y, logH0RGB.z)
                  u.toeCurvatureRGB = (toeCurvatureRGB.x, toeCurvatureRGB.y, toeCurvatureRGB.z)
                  u.shoulderCurvatureRGB = (shoulderCurvatureRGB.x, shoulderCurvatureRGB.y, shoulderCurvatureRGB.z)
                  u.spectralMatrix = simd_float3x3(columns: (spectralRow0, spectralRow1, spectralRow2)).transpose
                  u.dirCouplerMatrix = simd_float3x3(columns: (dirCouplerRow0, dirCouplerRow1, dirCouplerRow2)).transpose
                  u.halationReflectance = halationReflectance
                  u.halationGreenLeak = halationGreenLeak
                  u.halationThreshold = halationThreshold
                  u.halationRadiusPixels = halationRadiusPixels
                  u.diffuseRMSGranularity = diffuseRMSGranularity
                  u.eberhardEdgeBoost = eberhardEdgeBoost
                  u.mtf50CyclesPerMM = mtf50CyclesPerMM
                  u.developerTemperatureC = devTempC
                  u.developmentTimeScale = devTimeScale
                  u.agitationFactor = agitation
                  u.frameRandomSeed = frameSeed
                  return u
              }
          }
          
