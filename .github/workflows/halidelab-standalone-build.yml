          // Grain Morphology Enum matching authentic silver halide crystal structures
          typedef NS_ENUM(int32_t, GrainMorphologyType) {
              GrainMorphologyCubic   = 0, // Classic Cubic Crystal (e.g. Kodak Tri-X 400, Ilford HP5 Plus)
              GrainMorphologyTabular = 1, // Flat T-Grain / Sub-Micron Crystal (e.g. Portra 400, T-Max 400, Vision3 500T)
              GrainMorphologyFineE6  = 2  // Ultra-fine Reversal Coupler Micelles (e.g. Velvia 50, Provia 100F)
          };
          
          // Film Process Chemistry Type
          typedef NS_ENUM(int32_t, FilmProcessType) {
              FilmProcessC41ColorNegative     = 0, // Standard Color Negative (37.8°C)
              FilmProcessBWMonochromeNegative = 1, // Black & White Silver Halide (20.0°C)
              FilmProcessE6ColorReversal      = 2, // Slide / Reversal Positive (38.0°C)
              FilmProcessECN2CinemaNegative   = 3, // Motion Picture Negative with Remjet (41.1°C)
              FilmProcessC41CrossRemjetFree   = 4  // CineStill 800T Remjet-Free C-41 Cross-Process
          };
          
          // Darkroom Enlarger Light Source Type
          typedef NS_ENUM(int32_t, EnlargerLightHeadType) {
              EnlargerLightCondenser = 0, // Point source + Condenser lenses (High Callier Factor Q ~ 1.16, crisp grain)
              EnlargerLightDiffuser  = 1  // Dichroic mixing box / Cold cathode (Callier Factor Q ~ 1.00, smooth tonal transitions)
          };
          
          // Darkroom Chemical Toner Type
          typedef NS_ENUM(int32_t, ChemicalTonerType) {
              ChemicalTonerNone     = 0,
              ChemicalTonerSelenium = 1, // Kodak Rapid Selenium Toner (1+19): deepens Dmax (+0.15) & cool eggplant shadow tint
              ChemicalTonerSepia    = 2, // Sulfide Bleach & Redevelop: warm chestnut midtones
              ChemicalTonerGold     = 3  // Gold Chloride protective blue-black shift
          };
          
          // Stage 1: Physical Optics Uniforms (iPhone 13 Pro Max 13mm / 26mm / 77mm + Simulated Mechanical Lens)
          struct PhysicalOpticsUniforms {
              float focalLengthMM;            // 13.0, 26.0, or 77.0 (or simulated 35mm/50mm/85mm)
              float nativeApertureFNumber;    // Hardware f/1.8, f/1.5, or f/2.8
              float simulatedApertureFNumber; // User-selected mechanical aperture f/1.2 - f/22.0
              float focusDistanceMeters;      // Focus plane distance in meters (0.02m - 50.0m)
              int32_t apertureBladeCount;     // 5, 6, 7, 8, or 9 blades
              float bladeCurvature;           // 0.0 (straight polygon) to 1.0 (circular)
              float sphericalAberration;      // -1.0 (under-corrected dreamy front bokeh) to +1.0 (over-corrected soap-bubble ring bokeh)
              float opticalVignettingCatEye;  // Mechanical barrel cutoff at edges (Cat's eye bokeh factor 0.0 - 1.0)
              float cosFourthFalloffStrength; // Natural cos^4(theta) illumination falloff
              float lateralChromaticAberration; // R/B radial magnification shift in microns
              float asphericalOnionRingIntensity; // Micro-grooves inside bokeh discs
              int32_t enableLiDARBokeh;       // 1 if LiDAR/PDAF depth map is active
              int32_t hasValidLiDARDepth;     // 1 only when hardware LiDAR depth texture is present and non-empty
              float realSensorISO;            // Real-time hardware ISO read from AVCaptureDevice
              float realSensorExposureSec;    // Real-time hardware exposureDuration read from AVCaptureDevice
          };
          
          // Stage 2: Authoritative Film Emulsion & Development Kinetics Uniforms
          struct FilmEmulsionUniforms {
              int32_t processType;            // FilmProcessType
              int32_t grainMorphology;        // GrainMorphologyType
              float isoNominal;               // e.g. 400.0, 50.0, 100.0, 500.0, 800.0
              float exposureIndexRated;       // User rated EI (e.g. pushed to 1600.0)
              float exposureTimeSeconds;      // Actual shutter speed for Schwarzschild reciprocity failure
              float reciprocityExponentRGB[3];// Schwarzschild p factor per emulsion layer (e.g. [0.86, 0.88, 0.83])
              
              // Hurter-Driffield (H-D) Sensitometric Curve Parameters per layer (Red/Cyan, Green/Magenta, Blue/Yellow)
              float dMinRGB[3];               // Base + Fog density (including Orange Mask for C-41/ECN-2)
              float dMaxRGB[3];               // Maximum saturation density
              float gammaRGB[3];              // Straight-line slope (Contrast gamma at nominal development)
              float logH0RGB[3];              // Speed point (Log exposure at midpoint density)
              float toeCurvatureRGB[3];       // Toe roll-in softness
              float shoulderCurvatureRGB[3];  // Shoulder roll-off latitude (+4 EV retention)
              
              // Spectral Sensitivity Cross-Talk Matrix (Linear ACEScg -> Emulsion Layer Actinic Exposure)
              BridgeFloat3x3 spectralMatrix;
              
              // DIR (Development Inhibitor Releasing) Couplers Inter-Image Matrix (3x3 with negative off-diagonals)
              BridgeFloat3x3 dirCouplerMatrix;
              
              // Anti-Halation & Base Scatter Parameters
              float halationReflectance;      // Red layer back-scatter intensity (0.04 for Portra, 0.38 for Remjet-free CineStill 800T)
              float halationGreenLeak;        // Secondary leakage into Green emulsion layer
              float halationThreshold;        // Linear radiance threshold for halation onset
              float halationRadiusPixels;     // Spatial scatter radius in pixels
              
