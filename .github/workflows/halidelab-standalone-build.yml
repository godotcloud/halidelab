          inline float3 linearP3ToACEScg(float3 p3) {
              const float3x3 mat = float3x3(
                  float3(0.679086f, 0.046002f, 0.005742f),
                  float3(0.214114f, 0.879460f, 0.043866f),
                  float3(0.106800f, 0.074538f, 0.950392f)
              );
              return max(float3(0.0f), mat * p3);
          }
          
          inline float3 acesCgToLinearP3(float3 aces) {
              const float3x3 mat = float3x3(
                  float3( 1.541738f, -0.078986f, -0.005677f),
                  float3(-0.373915f,  1.163161f, -0.051367f),
                  float3(-0.167823f, -0.084175f,  1.057044f)
              );
              return max(float3(0.0f), mat * aces);
          }
          
          inline float3 linearToDisplayP3Gamma(float3 lin) {
              lin = clamp(lin, 0.0f, 1.15f);
              float3 lo = lin * 12.92f;
              float3 hi = 1.055f * pow(max(lin, float3(1e-5f)), float3(1.0f / 2.4f)) - 0.055f;
              return select(hi, lo, lin <= 0.0031308f);
          }
          
          inline float3 displayP3GammaToLinear(float3 enc) {
              float3 lo = enc / 12.92f;
              float3 hi = pow(max((enc + 0.055f) / 1.055f, float3(0.0f)), float3(2.4f));
              return select(hi, lo, enc <= 0.04045f);
          }
          
          inline uint3 pcg3d(uint3 v) {
              v = v * 1664525u + 1013904223u;
              v.x += v.y * v.z;
              v.y += v.z * v.x;
              v.z += v.x * v.y;
              v ^= v >> 16u;
              v.x += v.y * v.z;
              v.y += v.z * v.x;
              v.z += v.x * v.y;
              return v;
          }
          
          inline float3 hash33(uint3 p) {
              uint3 h = pcg3d(p);
              return float3(h) * (1.0f / 4294967295.0f);
