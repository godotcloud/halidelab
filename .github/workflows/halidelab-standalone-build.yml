name: Build HalideLabPro iOS IPA (Standalone Zero-Unzip Workflow)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      runner_image:
        description: "GitHub Actions macOS Runner (macOS 14 is retired)"
        required: true
        default: "macos-15"
        type: choice
        options:
          - macos-15
          - macos-26
          - macos-latest
      build_configuration:
        description: "Build Configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      create_github_release:
        description: "Publish direct-download .ipa to GitHub Releases (No-Unzip Direct Download)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-standalone-ipa:
    name: Synthesize Project, Compile Metal 3 & Build Direct .ipa
    # GitHub Actions retired macos-14; defaults to macos-15 (Apple Silicon arm64)
    runs-on: ${{ inputs.runner_image || 'macos-15' }}
    timeout-minutes: 30

    env:
      PROJECT_NAME: HalideLabPro
      SCHEME_NAME: HalideLabPro
      CONFIGURATION: ${{ inputs.build_configuration || 'Release' }}
      DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData

    steps:
      - name: Checkout Repository (Optional if only this YAML exists)
        uses: actions/checkout@v4

      - name: Synthesize Full HalideLabPro iOS Source Tree (Zero-Unzip Self-Extracting Step)
        shell: bash
        run: |
          echo "=== Generating HalideLabPro iOS Project Structure Directly from Workflow ==="
          mkdir -p HalideLabPro/App \
                   HalideLabPro/Bridge \
                   HalideLabPro/Shaders \
                   HalideLabPro/Models \
                   HalideLabPro/Camera \
                   HalideLabPro/Engine \
                   HalideLabPro/Hardware \
                   HalideLabPro/UI \
                   HalideLabPro/Resources/Assets.xcassets/AppIcon.appiconset

          cat << 'EOF_HALIDE_FILE' > "README.md"
          # HalideLab Pro — First-Principles Physical Optics, Film Sensitometry & Darkroom Camera for iPhone 13 Pro Max
          
          **HalideLab Pro** is a native iOS application written in **Swift 5.10** and **Apple Metal Compute Shaders** engineered specifically for the **iPhone 13 Pro Max** (A15 Bionic 5-core GPU, 16-core Neural Engine, 6GB LPDDR4X unified memory, 120Hz ProMotion Super Retina XDR display, and 13mm / 26mm / 77mm + LiDAR optical system).
          
          Unlike LUT-based filter apps, HalideLab Pro models the complete physical and chemical chain of analog photography in **16-bit scene-linear floating-point radiance (`RGBA16Float` ACEScg)**:
          
          1. **Physical Optics Pass (`k_physical_optics_pass`)**:
             - Hardware calibration for iPhone 13 Pro Max **26mm $f/1.5$ Wide ($1.9\mu\text{m}$ pixels, Sensor-Shift OIS)**, **13mm $f/1.8$ Ultra Wide**, and **77mm $f/2.8$ Telephoto**.
             - Real-time LiDAR + Dual-Pixel PDAF depth map synchronization (`AVCaptureDataOutputSynchronizer`) driving exact Gaussian thick-lens **Circle of Confusion (CoC)** bokeh, N-blade polygonal iris geometry, mechanical **Cat's Eye optical vignetting**, over/under-corrected **spherical aberration**, aspherical onion-ring micro-grooves, **$\cos^4(\theta)$ natural illumination falloff**, lateral chromatic aberration, and **Fraunhofer aperture diffraction starbursts** ($f/8 - f/22$).
          2. **Authoritative Film Emulsion Sensitometry Pass (`k_film_emulsion_pass`)**:
             - Hardcoded sensitometric parameters digitized from official **Kodak**, **Fujifilm**, and **Ilford** technical data sheets:
               - **Kodak Professional Portra 400** (Pub E-4050, C-41, $\sigma_D = 11$, Orange Mask, T-Grain)
               - **Kodak Professional Tri-X 400** (Pub F-4017, B&W D-76, $\sigma_D = 17$, Classic Cubic Grain)
               - **Kodak Professional T-Max 400** (Pub F-4043, B&W T-Max Dev, $\sigma_D = 10$, T-Grain, high Eberhard acutance)
               - **Ilford HP5 Plus 400** (Harman Tech Sheet, ID-11 / Microphen push to EI 3200, $\sigma_D = 16$)
               - **Fujifilm Fujichrome Velvia 50** (RVP50 Data Guide, E-6 Reversal, $\sigma_D = 9$, $D_{\max} > 3.6$)
               - **Fujifilm Fujichrome Provia 100F** (RDPIII Data Sheet, E-6 Reversal, $\sigma_D = 8$, zero reciprocity failure to 128s)
               - **Kodak Vision3 500T (5219) / CineStill 800T** (Pub H-1-5219, 3200K Tungsten, Remjet-free C-41 cross-process with double-exponential red halation corona)
             - Implements **Hurter-Driffield (H-D) characteristic curves**, **Schwarzschild reciprocity failure** ($E_{\text{eff}} = E \cdot t^p$), **Arrhenius chemical development kinetics** (temperature, push/pull time, and stand-development bromide drag / Eberhard Mackie lines), **DIR coupler inter-image $3\times 3$ matrices**, and **3D Monte Carlo Poisson/Gabor cellular silver halide grain** coupled to Selwyn's Law.
          3. **Darkroom Enlarger & Photographic Paper Print Pass (`k_darkroom_enlarger_print_pass`)**:
             - Condenser ($Q = 1.16$) vs. Diffuser ($Q = 1.00$) enlarger light head Callier scattering.
             - **RA-4 Color Head** with subtractive **Yellow / Magenta / Cyan (0–200 CC)** dichroic filtration on **Kodak Endura Premier (E-4070)** and **Kodak Ektacolor Edge (E-7020)** papers.
             - **Ilford Multigrade RC Deluxe & Fibre Base Warmtone** variable-contrast B&W papers with **Grades 00 to 5** filtration, **Split-Grade Printing**, physical **Dodging & Burning** exposure wands, and **Selenium / Sepia / Gold chemical toning**.
             - Built-in **Ansel Adams $1^\circ$ Spot Meter & Zone System (Zone 0 – Zone X)** false-color overlay and **CoreHaptics** mechanical detents.
          
          ---
          
          ## Building Automatically with GitHub Actions (`macos-15` / `macos-26`)
          
          > **Important Note on GitHub Actions Runners**: GitHub has retired the `macos-14` runner image. The included workflow `.github/workflows/ios-build.yml` targets **`macos-15`** (Apple Silicon arm64) by default and also supports `macos-26` and `macos-latest` via manual dispatch.
          
          ### Quick Steps to Compile Your `.ipa` on GitHub:
          1. Create a new GitHub repository and push all files in this directory to the `main` branch.
          2. Navigate to the **Actions** tab in your GitHub repository and select **Build HalideLabPro iOS App (iPhone 13 Pro Max Edition)**.
          3. The workflow automatically:
             - Runs `xcodegen generate` using `project.yml` to synthesize `HalideLabPro.xcodeproj`.
             - Pre-compiles and validates `AnalogPipelineShaders.metal` into an iOS Metal library (`default.metallib`) targeting A15 Bionic.
             - Compiles the full Release iOS app bundle and packages an installable `HalideLabPro-Release-Unsigned.ipa` artifact (ready for sideloading via AltStore, SideStore, Sideloadly, TrollStore, or re-signing with your Apple Developer certificate).
          EOF_HALIDE_FILE

          cat << 'EOF_HALIDE_FILE' > "project.yml"
          name: HalideLabPro
          options:
            bundleIdPrefix: com.halidelab
            deploymentTarget:
              iOS: "16.0"
            xcodeVersion: "16.0"
            createIntermediateGroups: true
            generateEmptyDirectories: true
          
          settings:
            base:
              SWIFT_VERSION: "5.10"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              TARGETED_DEVICE_FAMILY: "1" # iPhone Optimized (specifically iPhone 13 Pro Max 6.7" 120Hz XDR)
              SUPPORTS_MACCATALYST: NO
              SWIFT_OBJC_BRIDGING_HEADER: "HalideLabPro/Bridge/ShaderBridgeTypes.h"
              MTL_FAST_MATH: YES
              MTL_LANGUAGE_REVISION: "Metal24"
              GCC_OPTIMIZATION_LEVEL: "s"
              SWIFT_OPTIMIZATION_LEVEL: "-O"
          
          targets:
            HalideLabPro:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: HalideLabPro
                  excludes:
                    - "**/*.md"
              info:
                path: HalideLabPro/Resources/Info.plist
                properties:
                  CFBundleDisplayName: "HalideLab Pro"
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "100"
                  LSRequiresIPhoneOS: true
                  UIRequiresFullScreen: true
                  UIStatusBarHidden: true
                  UIViewControllerBasedStatusBarAppearance: false
                  CADisableMinimumFrameDurationOnPhone: true # Unlock 120Hz ProMotion on iPhone 13 Pro Max
                  UILaunchScreen:
                    UIColorName: ""
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  NSCameraUsageDescription: "HalideLab Pro requires direct hardware access to iPhone 13 Pro Max 13mm, 26mm, and 77mm sensors and LiDAR scanner for 12-bit Pure Bayer RAW capture and physical optical simulation."
                  NSPhotoLibraryAddUsageDescription: "HalideLab Pro saves 12-bit DNG negatives, non-destructive darkroom sidecar recipes, and 16-bit Display P3 prints to your Photo Library."
                  NSPhotoLibraryUsageDescription: "HalideLab Pro accesses your negatives and contact sheets for darkroom printing."
                  NSMotionUsageDescription: "HalideLab Pro uses the 3-axis gyroscope for the precision dual-ring horizon level and exposure stability estimation."
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.halidelab.pro.iphone13promax
                  INFOPLIST_FILE: HalideLabPro/Resources/Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ENABLE_BITCODE: NO
              dependencies:
                - sdk: AVFoundation.framework
                - sdk: Metal.framework
                - sdk: MetalKit.framework
                - sdk: MetalPerformanceShaders.framework
                - sdk: CoreImage.framework
                - sdk: CoreMedia.framework
                - sdk: CoreVideo.framework
                - sdk: CoreMotion.framework
                - sdk: CoreHaptics.framework
                - sdk: Accelerate.framework
                - sdk: Photos.framework
                - sdk: ImageIO.framework
                - sdk: UniformTypeIdentifiers.framework
          EOF_HALIDE_FILE

          cat << 'EOF_HALIDE_FILE' > "HalideLabPro/App/HalideLabProApp.swift"
          import SwiftUI
          
          @main
          struct HalideLabProApp: App {
              var body: some Scene {
                  WindowGroup {
                      MechanicalCameraView()
                          .preferredColorScheme(.dark)
                          .statusBar(hidden: true)
                  }
              }
          }
          EOF_HALIDE_FILE

          cat << 'EOF_HALIDE_FILE' > "HalideLabPro/UI/MechanicalCameraView.swift"
          import SwiftUI
          
          struct MechanicalCameraView: View {
              @StateObject private var renderEngine = MetalRenderEngine()
              @StateObject private var cameraPipeline = CameraCapturePipeline()
              @ObservedObject private var motionAndHaptics = MechanicalHapticsAndMotion.shared
          
              @State private var activeWorkspaceTab: WorkspaceTab = .cameraDeck
              @State private var showDatasheetInspector: Bool = false
              @State private var showContactSheetGallery: Bool = false
              @State private var countdownRemaining: Int = 0
              @State private var shutterFlashOpacity: Double = 0.0
          
              enum WorkspaceTab: String, CaseIterable {
                  case cameraDeck       = "CAMERA"
                  case opticsBench      = "OPTICS"
                  case emulsionAndChem  = "EMULSION"
                  case darkroomEnlarger = "DARKROOM"
              }
          
              private let romanZones = ["0", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"]
              private let standardApertures: [Float] = [1.2, 1.4, 1.5, 1.8, 2.0, 2.8, 4.0, 5.6, 8.0, 11.0, 16.0, 22.0]
              private let standardShutters: [(String, Float)] = [
                  ("1/8000", 1.0/8000.0), ("1/4000", 1.0/4000.0), ("1/2000", 1.0/2000.0),
                  ("1/1000", 1.0/1000.0), ("1/500", 1.0/500.0),   ("1/250", 1.0/250.0),
                  ("1/125", 1.0/125.0),   ("1/60", 1.0/60.0),     ("1/30", 1.0/30.0),
                  ("1/15", 1.0/15.0),     ("1/4", 0.25),          ("1s", 1.0),
                  ("4s (Recip.)", 4.0),   ("15s (Recip.)", 15.0), ("30s (B)", 30.0)
              ]
          
              var body: some View {
                  ZStack {
                      Color(red: 0.05, green: 0.05, blue: 0.06).ignoresSafeArea()
          
                      VStack(spacing: 0) {
                          // 1. Top Precision Telemetry & Tool Bar
                          topTelemetryHeader
          
                          // 2. Optical Rangefinder Viewfinder with Brightline Frames, 1-Degree Spot Meter, Focus Reticle & Save Toast
                          ZStack {
                              MetalViewfinderRepresentable(renderEngine: renderEngine)
                                  .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 12, style: .continuous)
                                          .stroke(Color.white.opacity(0.18), lineWidth: 1)
                                  )
                                  .gesture(
                                      DragGesture(minimumDistance: 0)
                                          .onChanged { value in
                                              let size: CGSize = UIScreen.main.bounds.size
                                              let viewW: CGFloat = max(size.width - 24.0, 1.0)
                                              let viewH: CGFloat = max(size.height * 0.44, 1.0)
                                              let rawX: CGFloat = value.location.x / viewW
                                              let rawY: CGFloat = value.location.y / viewH
                                              let ux: Float = Float(min(max(rawX, 0.05), 0.95))
                                              let uy: Float = Float(min(max(rawY, 0.05), 0.95))
                                              let targetUV = SIMD2<Float>(ux, uy)
                                              if activeWorkspaceTab == .darkroomEnlarger && abs(renderEngine.dodgeBurnStops) > 0.01 {
                                                  renderEngine.dodgeBurnCenterUV = targetUV
                                              } else {
                                                  renderEngine.spotMeterTargetUV = targetUV
                                                  renderEngine.focusPointUV = targetUV
                                                  cameraPipeline.setFocusPointOfInterest(normalizedUV: targetUV)
                                              }
                                          }
                                  )
          
                              viewfinderOverlayHUD
          
                              // Shutter Curtain Flash Feedback
                              RoundedRectangle(cornerRadius: 12, style: .continuous)
                                  .fill(Color.white.opacity(shutterFlashOpacity))
                                  .allowsHitTesting(false)
                          }
                          .padding(.horizontal, 10)
                          .padding(.vertical, 4)
          
                          // 3. 18-Film Stock Quick Selector Ribbon
                          filmRibbonAndZoneScaleBar
          
                          // 4. 4-Bench Mode Selector Tabs (CAMERA / OPTICS / EMULSION / DARKROOM)
                          workspaceTabSelector
          
                          // 5. Interactive Mechanical Dials & Darkroom Controls
                          ScrollView(.vertical, showsIndicators: false) {
                              VStack(spacing: 11) {
                                  switch activeWorkspaceTab {
                                  case .cameraDeck:
                                      proCameraDeckControls
                                  case .opticsBench:
                                      physicalOpticsBenchControls
                                  case .emulsionAndChem:
                                      emulsionAndChemistryControls
                                  case .darkroomEnlarger:
                                      darkroomEnlargerControls
                                  }
                              }
                              .padding(.horizontal, 14)
                              .padding(.vertical, 8)
                          }
                          .frame(maxHeight: 225)
          
                          // 6. Bottom Shutter Release Deck, Lens Turret & Contact Sheet Button
                          bottomShutterDeck
                      }
                  }
                  .sheet(isPresented: $showDatasheetInspector) {
                      datasheetInspectorModal
                  }
                  .sheet(isPresented: $showContactSheetGallery) {
                      contactSheetGalleryModal
                  }
                  .onAppear {
                      cameraPipeline.bindMetalDevice(renderEngine.device)
                      renderEngine.cameraPipeline = cameraPipeline
                      cameraPipeline.requestPermissionsAndStart()
                  }
              }
          
              // MARK: - Top Telemetry Header
              private var topTelemetryHeader: some View {
                  HStack(spacing: 6) {
                      VStack(alignment: .leading, spacing: 2) {
                          HStack(spacing: 5) {
                              Circle()
                                  .fill(cameraPipeline.usePureBayerRAWOverProRAW ? Color.orange : Color.cyan)
                                  .frame(width: 7, height: 7)
                              Text(renderEngine.selectedFilmFormat.rawValue.uppercased())
                                  .font(.system(size: 9, weight: .bold, design: .monospaced))
                                  .foregroundColor(.orange)
                          }
                          Text(renderEngine.selectedFilm.displayName.uppercased() + " • EI \(Int(renderEngine.ratedEI))")
                              .font(.system(size: 11, weight: .bold, design: .monospaced))
                              .foregroundColor(.white)
                              .lineLimit(1)
                      }
          
                      Spacer()
          
                      // Rule-of-Thirds Grid Toggle
                      Button {
                          renderEngine.showGridOverlay.toggle()
                          motionAndHaptics.playApertureDetentClick()
                      } label: {
                          Text("GRID")
                              .font(.system(size: 9, weight: .bold, design: .monospaced))
                              .padding(.horizontal, 7)
                              .padding(.vertical, 5)
                              .background(renderEngine.showGridOverlay ? Color.orange.opacity(0.85) : Color.white.opacity(0.12))
                              .foregroundColor(renderEngine.showGridOverlay ? .black : .white)
                              .cornerRadius(4)
                      }
          
                      // Zebra Clipping Stripes Toggle
                      Button {
                          renderEngine.enableZebraWarnings.toggle()
                          motionAndHaptics.playApertureDetentClick()
                      } label: {
                          Text("ZEBRA")
                              .font(.system(size: 9, weight: .bold, design: .monospaced))
                              .padding(.horizontal, 7)
                              .padding(.vertical, 5)
                              .background(renderEngine.enableZebraWarnings ? Color.red.opacity(0.85) : Color.white.opacity(0.12))
                              .foregroundColor(.white)
                              .cornerRadius(4)
                      }
          
                      // Zone System False Color Toggle
                      Button {
                          renderEngine.enableZoneFalseColor.toggle()
                          motionAndHaptics.playApertureDetentClick()
                      } label: {
                          Text("ZONE")
                              .font(.system(size: 9, weight: .bold, design: .monospaced))
                              .padding(.horizontal, 7)
                              .padding(.vertical, 5)
                              .background(renderEngine.enableZoneFalseColor ? Color.green.opacity(0.85) : Color.white.opacity(0.12))
                              .foregroundColor(renderEngine.enableZoneFalseColor ? .black : .white)
                              .cornerRadius(4)
                      }
          
                      // Focus Peaking Toggle
                      Button {
                          renderEngine.enableFocusPeaking.toggle()
                          motionAndHaptics.playApertureDetentClick()
                      } label: {
                          Text("PEAK")
                              .font(.system(size: 9, weight: .bold, design: .monospaced))
                              .padding(.horizontal, 7)
                              .padding(.vertical, 5)
                              .background(renderEngine.enableFocusPeaking ? Color.yellow.opacity(0.85) : Color.white.opacity(0.12))
                              .foregroundColor(renderEngine.enableFocusPeaking ? .black : .white)
                              .cornerRadius(4)
                      }
          
                      // Datasheet Spec Inspector
                      Button {
                          showDatasheetInspector = true
                      } label: {
                          Image(systemName: "info.circle")
                              .font(.system(size: 15, weight: .semibold))
                              .foregroundColor(.orange)
                      }
                  }
                  .padding(.horizontal, 12)
                  .padding(.vertical, 6)
                  .background(Color.black.opacity(0.75))
              }
          
              // MARK: - Viewfinder HUD
              private var viewfinderOverlayHUD: some View {
                  GeometryReader { geo in
                      ZStack {
                          // Leica Brightline Framelines
                          RoundedRectangle(cornerRadius: 4)
                              .strokeBorder(style: StrokeStyle(lineWidth: 1.1, dash: [18, 6]))
                              .foregroundColor(Color.white.opacity(0.50))
                              .padding(16)
          
                          // Rule of Thirds / Golden Grid Overlay
                          if renderEngine.showGridOverlay {
                              Path { path in
                                  let w = geo.size.width
                                  let h = geo.size.height
                                  path.move(to: CGPoint(x: w / 3.0, y: 16))
                                  path.addLine(to: CGPoint(x: w / 3.0, y: h - 16))
                                  path.move(to: CGPoint(x: 2.0 * w / 3.0, y: 16))
                                  path.addLine(to: CGPoint(x: 2.0 * w / 3.0, y: h - 16))
                                  path.move(to: CGPoint(x: 16, y: h / 3.0))
                                  path.addLine(to: CGPoint(x: w - 16, y: h / 3.0))
                                  path.move(to: CGPoint(x: 16, y: 2.0 * h / 3.0))
                                  path.addLine(to: CGPoint(x: w - 16, y: 2.0 * h / 3.0))
                              }
                              .stroke(Color.white.opacity(0.20), lineWidth: 0.7)
                          }
          
                          // Gyroscope Horizon Indicator
                          HStack(spacing: 4) {
                              Rectangle()
                                  .fill(motionAndHaptics.isLevelAligned ? Color.green : Color.white.opacity(0.5))
                                  .frame(width: 28, height: 1.5)
                              Text(String(format: "%+.1f°", motionAndHaptics.rollDegrees))
                                  .font(.system(size: 9, weight: .bold, design: .monospaced))
                                  .foregroundColor(motionAndHaptics.isLevelAligned ? .green : .white.opacity(0.75))
                              Rectangle()
                                  .fill(motionAndHaptics.isLevelAligned ? Color.green : Color.white.opacity(0.5))
                                  .frame(width: 28, height: 1.5)
                          }
                          .rotationEffect(.degrees(-motionAndHaptics.rollDegrees))
                          .position(x: geo.size.width * 0.5, y: 24)
          
                          // 1-Degree Spot Meter & Focus Target Reticle
                          let spotX = CGFloat(renderEngine.spotMeterTargetUV.x) * geo.size.width
                          let spotY = CGFloat(renderEngine.spotMeterTargetUV.y) * geo.size.height
                          ZStack {
                              Circle()
                                  .stroke(Color.orange, lineWidth: 1.5)
                                  .frame(width: 30, height: 30)
                              Circle()
                                  .fill(Color.orange)
                                  .frame(width: 3, height: 3)
                              Text("ZONE \(romanZones[min(max(renderEngine.currentAdamsZone, 0), 10)]) • f/\(String(format: "%.1f", renderEngine.simulatedApertureFNumber))")
                                  .font(.system(size: 9, weight: .black, design: .monospaced))
                                  .padding(.horizontal, 5)
                                  .padding(.vertical, 2)
                                  .background(Color.black.opacity(0.78))
                                  .foregroundColor(.orange)
                                  .cornerRadius(3)
                                  .offset(y: -24)
                          }
                          .position(x: spotX, y: spotY)
          
                          // Self-Timer Countdown Overlay
                          if countdownRemaining > 0 {
                              Text("\(countdownRemaining)")
                                  .font(.system(size: 64, weight: .black, design: .monospaced))
                                  .foregroundColor(.orange)
                                  .shadow(color: .black, radius: 8)
                          }
          
                          // Save Confirmation Toast Banner
                          if let toast = cameraPipeline.saveToastMessage {
                              Text(toast)
                                  .font(.system(size: 11, weight: .bold, design: .monospaced))
                                  .padding(.horizontal, 12)
                                  .padding(.vertical, 7)
                                  .background(Color.green.opacity(0.92))
                                  .foregroundColor(.black)
                                  .cornerRadius(8)
                                  .frame(maxHeight: .infinity, alignment: .top)
                                  .padding(.top, 38)
                          }
          
                          // Bottom-Left Sensitometric Density Readout
                          VStack(alignment: .leading, spacing: 2) {
                              Text(String(format: "SPOT EV100: %+.1f EV • ZONE %d (%@) • EXP %+.1f EV",
                                          renderEngine.currentSpotEV100,
                                          renderEngine.currentAdamsZone,
                                          romanZones[min(max(renderEngine.currentAdamsZone, 0), 10)],
                                          renderEngine.exposureBiasEV))
                                  .font(.system(size: 9.5, weight: .bold, design: .monospaced))
                                  .foregroundColor(.white)
                              Text(String(format: "DENSITY D(R,G,B): %.2f / %.2f / %.2f • %@ • RMS σD=%.1f",
                                          renderEngine.currentSpotDensityRGB.x,
                                          renderEngine.currentSpotDensityRGB.y,
                                          renderEngine.currentSpotDensityRGB.z,
                                          renderEngine.selectedLensPreset.displayName,
                                          renderEngine.selectedFilm.diffuseRMSGranularity))
                                  .font(.system(size: 8.5, weight: .medium, design: .monospaced))
                                  .foregroundColor(Color.white.opacity(0.82))
                                  .lineLimit(1)
                          }
                          .padding(7)
                          .background(Color.black.opacity(0.65))
                          .cornerRadius(6)
                          .frame(maxWidth: .infinity, maxHeight: .infinity, alignment: .bottomLeading)
                          .padding(10)
                      }
                  }
              }
          
              // MARK: - 18-Film Stock Selector Ribbon
              private var filmRibbonAndZoneScaleBar: some View {
                  ScrollView(.horizontal, showsIndicators: false) {
                      HStack(spacing: 8) {
                          ForEach(FilmStockDatabase.allFilms) { film in
                              let isSelected = (film.id == renderEngine.selectedFilm.id)
                              Button {
                                  renderEngine.selectFilmStock(film)
                              } label: {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(film.displayName)
                                          .font(.system(size: 11, weight: .bold, design: .monospaced))
                                          .foregroundColor(isSelected ? .black : .white)
                                      Text("\(film.codeName) • RMS \(String(format: "%.1f", film.diffuseRMSGranularity))")
                                          .font(.system(size: 8.5, weight: .medium, design: .monospaced))
                                          .foregroundColor(isSelected ? .black.opacity(0.75) : .gray)
                                  }
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 5)
                                  .background(isSelected ? Color.orange : Color.white.opacity(0.09))
                                  .cornerRadius(6)
                              }
                          }
                      }
                      .padding(.horizontal, 12)
                      .padding(.vertical, 5)
                  }
                  .background(Color.black.opacity(0.55))
              }
          
              // MARK: - 4-Tab Selector
