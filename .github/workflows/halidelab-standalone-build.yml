          kernel void k_physical_optics_pass(
              texture2d<float, access::sample> inCameraTex     [[texture(0)]],
              texture2d<float, access::sample> inLiDARDepthTex [[texture(1)]],
              texture2d<float, access::write>  outLinearTex    [[texture(2)]],
              constant PhysicalOpticsUniforms& optics          [[buffer(0)]],
              uint2 gid                                        [[thread_position_in_grid]]
          ) {
              uint width = outLinearTex.get_width();
              uint height = outLinearTex.get_height();
              if (gid.x >= width || gid.y >= height) return;
          
              constexpr sampler linSampler(coord::normalized, address::clamp_to_edge, filter::linear);
              float2 res = float2(width, height);
              float2 uv = (float2(gid) + 0.5f) / res;
              float2 centeredUV = (uv - 0.5f) * 2.0f;
              centeredUV.x *= res.x / res.y;
              float radialDist = length(centeredUV);
          
              // 1. Lateral Chromatic Aberration (R/B radial magnification dispersion visible toward frame corners)
              float caShift = optics.lateralChromaticAberration * 0.012f * radialDist * radialDist;
              float2 uvR = 0.5f + (uv - 0.5f) * (1.0f + caShift);
              float2 uvG = uv;
              float2 uvB = 0.5f + (uv - 0.5f) * (1.0f - caShift * 1.15f);
          
              float3 rawSample;
              rawSample.r = inCameraTex.sample(linSampler, uvR).r;
              rawSample.g = inCameraTex.sample(linSampler, uvG).g;
              rawSample.b = inCameraTex.sample(linSampler, uvB).b;
          
              // Linearize, apply Exposure Compensation (EV Bias), and apply Planckian White Balance
              float3 centerLinear = linearP3ToACEScg(displayP3GammaToLinear(rawSample)) * exp2(optics.exposureBiasEV);
              centerLinear = applyPlanckianWhiteBalance(centerLinear, optics.wbTemperatureKelvin, optics.wbTintShift);
          
              float luma = dot(centerLinear, float3(0.2126f, 0.7152f, 0.0722f));
              float highlightGain = 1.0f + 0.75f * luma * luma;
