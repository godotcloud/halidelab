              // 3. Fraunhofer Aperture Diffraction Starbursts when stopped down (f/8.0 - f/22.0)
              if (optics.simulatedApertureFNumber >= 8.0f) {
                  float diffractionStrength = clamp((optics.simulatedApertureFNumber - 7.5f) / 14.5f, 0.0f, 1.0f);
                  int numSpikes = (optics.apertureBladeCount % 2 == 0) ? optics.apertureBladeCount : (optics.apertureBladeCount * 2);
                  float3 spikeAccum = float3(0.0f);
          
                  for (int s = 0; s < numSpikes; ++s) {
                      float spikeAngle = float(s) * (2.0f * M_PI_F / float(numSpikes)) + 0.26f;
                      float2 spikeDir = float2(cos(spikeAngle), sin(spikeAngle)) / res;
                      for (int step = 1; step <= 6; ++step) {
                          float distPx = float(step) * 3.0f;
                          float3 sCol = linearP3ToACEScg(displayP3GammaToLinear(inCameraTex.sample(linSampler, uv + spikeDir * distPx).rgb));
                          float sLuma = dot(sCol, float3(0.2126f, 0.7152f, 0.0722f));
                          if (sLuma > 0.90f) {
                              float falloff = exp(-float(step) * 0.48f) * (sLuma - 0.90f) * 2.0f;
                              spikeAccum += sCol * falloff;
                          }
