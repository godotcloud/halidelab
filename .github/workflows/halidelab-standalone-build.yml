          inline float3 applyPlanckianWhiteBalance(float3 linearRGB, float kelvin, float tint) {
              // Normalize around 5500K daylight reference:
              // Lower Kelvin (e.g. 3200K) cools scene (boosts Blue, trims Red); Higher Kelvin (e.g. 7500K) warms scene (boosts Red, trims Blue)
              float kShift = clamp((kelvin - 5500.0f) / 3000.0f, -1.2f, 1.2f);
              float3 wbGain = float3(
                  1.0f + kShift * 0.38f + tint * 0.12f,
                  1.0f - abs(kShift) * 0.04f - tint * 0.18f,
                  1.0f - kShift * 0.38f + tint * 0.12f
              );
              return max(float3(0.0f), linearRGB * wbGain);
