              // 4. Natural Optical Vignetting: cos^4(theta) law
              float halfDiagonalMM = 21.63f; // 35mm full-frame equivalent half-diagonal
              float rMM = (radialDist * 0.5f) * halfDiagonalMM;
              float tanTheta = rMM / max(optics.focalLengthMM, 12.0f);
              float cosTheta = 1.0f / sqrt(1.0f + tanTheta * tanTheta);
              float cos4Attenuation = pow(cosTheta, 4.0f * optics.cosFourthFalloffStrength * 0.65f);
              accumRadiance *= clamp(cos4Attenuation, 0.35f, 1.0f);
          
              outLinearTex.write(float4(accumRadiance, 1.0f), gid);
