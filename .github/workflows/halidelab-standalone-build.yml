          import Foundation
          import AVFoundation
          import CoreVideo
          import CoreMedia
          import Metal
          import Photos
          import UIKit
          
          /// Hardware optical module descriptors tailored to iPhone 13 Pro Max (A15 Bionic)
          enum iPhone13ProMaxLens: String, CaseIterable, Identifiable {
              case ultraWide13mm = "13mm f/1.8 Ultra Wide"
              case wide26mm      = "26mm f/1.5 Primary Wide"
              case telephoto77mm = "77mm f/2.8 3x Telephoto"
          
              var id: String { rawValue }
          
              var focalLengthMM: Float {
                  switch self {
                  case .ultraWide13mm: return 13.0
                  case .wide26mm:      return 26.0
                  case .telephoto77mm: return 77.0
                  }
              }
          
              var nativeApertureFNumber: Float {
                  switch self {
                  case .ultraWide13mm: return 1.8
                  case .wide26mm:      return 1.5
                  case .telephoto77mm: return 2.8
                  }
              }
          
              var avDeviceType: AVCaptureDevice.DeviceType {
                  switch self {
                  case .ultraWide13mm: return .builtInUltraWideCamera
                  case .wide26mm:      return .builtInWideAngleCamera
                  case .telephoto77mm: return .builtInTelephotoCamera
                  }
              }
          }
          
          /// Manages zero-copy CVMetalTextureCache video/LiDAR streaming and 12-bit Pure Bayer RAW / Apple ProRAW capture.
          final class CameraCapturePipeline: NSObject, ObservableObject {
              @Published var activeLens: iPhone13ProMaxLens = .wide26mm
              @Published var usePureBayerRAWOverProRAW: Bool = true
              @Published var isAutoExposureEnabled: Bool = true
              @Published var isAutoFocusEnabled: Bool = true
              @Published var liveHardwareISO: Float = 400.0
              @Published var liveHardwareShutterSeconds: Float = 1.0 / 60.0
              @Published var isSessionRunning: Bool = false
              @Published var statusMessage: String = "Initializing A15 Bionic ISP & Sensor-Shift OIS..."
              @Published var capturedRollsCount: Int = 0
              @Published var latestCapturedPreviewImage: UIImage?
          
              let captureSession = AVCaptureSession()
              private let sessionQueue = DispatchQueue(label: "com.halidelab.pro.camera.session", qos: .userInteractive)
              private let dataOutputQueue = DispatchQueue(label: "com.halidelab.pro.camera.data", qos: .userInteractive)
          
              private var videoDeviceInput: AVCaptureDeviceInput?
              private let videoDataOutput = AVCaptureVideoDataOutput()
              private let depthDataOutput = AVCaptureDepthDataOutput()
              private let photoOutput = AVCapturePhotoOutput()
              private var outputSynchronizer: AVCaptureDataOutputSynchronizer?
          
              private var metalDevice: MTLDevice?
              private var textureCache: CVMetalTextureCache?
          
              // Latest zero-copy Metal textures from camera & LiDAR
              private let textureLock = NSLock()
              private var _latestCameraTexture: MTLTexture?
              private var _latestDepthTexture: MTLTexture?
          
              var latestTextures: (camera: MTLTexture?, depth: MTLTexture?) {
                  textureLock.lock()
                  defer { textureLock.unlock() }
                  return (_latestCameraTexture, _latestDepthTexture)
              }
          
              private var inFlightPhotoDelegates: [Int64: RAWPhotoCaptureProcessor] = [:]
          
              func bindMetalDevice(_ device: MTLDevice) {
                  self.metalDevice = device
                  var cache: CVMetalTextureCache?
                  CVMetalTextureCacheCreate(kCFAllocatorDefault, nil, device, nil, &cache)
                  self.textureCache = cache
              }
          
              func requestPermissionsAndStart() {
                  switch AVCaptureDevice.authorizationStatus(for: .video) {
                  case .authorized:
                      sessionQueue.async { self.configureSession(for: self.activeLens) }
                  case .notDetermined:
                      AVCaptureDevice.requestAccess(for: .video) { granted in
                          if granted {
                              self.sessionQueue.async { self.configureSession(for: self.activeLens) }
                          } else {
                              DispatchQueue.main.async {
                                  self.statusMessage = "Camera Permission Denied — Running Synthetic Optical Test Chart"
                              }
                          }
                      }
                  default:
                      DispatchQueue.main.async {
                          self.statusMessage = "Camera Unavailable — Running Synthetic Optical Test Chart"
                      }
                  }
              }
          
              func switchOpticalLens(_ newLens: iPhone13ProMaxLens) {
                  guard newLens != activeLens else { return }
                  DispatchQueue.main.async { self.activeLens = newLens }
                  MechanicalHapticsAndMotion.shared.playApertureDetentClick(intensity: 0.90, sharpness: 0.95)
                  sessionQueue.async {
                      self.configureSession(for: newLens)
                  }
              }
          
              func enableAperturePriorityAutoExposure() {
                  DispatchQueue.main.async { self.isAutoExposureEnabled = true }
                  sessionQueue.async { [weak self] in
                      guard let self = self, let device = self.videoDeviceInput?.device else { return }
                      do {
                          try device.lockForConfiguration()
                          if device.isExposureModeSupported(.continuousAutoExposure) {
                              device.exposureMode = .continuousAutoExposure
                          }
                          device.unlockForConfiguration()
                      } catch {}
                  }
              }
          
              func setManualExposureAndFocus(iso: Float, shutterSeconds: Float, focusDistanceMeters: Float, lockExposure: Bool, lockFocus: Bool) {
                  DispatchQueue.main.async {
                      if lockExposure { self.isAutoExposureEnabled = false }
                      if lockFocus { self.isAutoFocusEnabled = false }
                  }
                  sessionQueue.async { [weak self] in
                      self?.applyHardwareExposureAndFocus(
                          iso: iso,
                          shutterSeconds: shutterSeconds,
                          focusDistanceMeters: focusDistanceMeters,
                          lockExposure: lockExposure,
                          lockFocus: lockFocus
                      )
                  }
              }
          
              private func applyHardwareExposureAndFocus(
                  iso: Float,
                  shutterSeconds: Float,
                  focusDistanceMeters: Float,
                  lockExposure: Bool,
                  lockFocus: Bool
              ) {
                  guard let device = self.videoDeviceInput?.device else { return }
                  do {
                      try device.lockForConfiguration()
                      if lockExposure && device.isExposureModeSupported(.custom) {
                          let minISO: Float = device.activeFormat.minISO
                          let maxISO: Float = device.activeFormat.maxISO
                          let clampedISO: Float = min(max(iso, minISO), maxISO)
          
                          let minDur: Double = CMTimeGetSeconds(device.activeFormat.minExposureDuration)
                          let maxDur: Double = CMTimeGetSeconds(device.activeFormat.maxExposureDuration)
                          let requestedSec: Double = Double(shutterSeconds)
                          let clampedSec: Double = min(max(requestedSec, minDur), maxDur)
                          let duration: CMTime = CMTimeMakeWithSeconds(clampedSec, preferredTimescale: 1_000_000)
          
                          device.setExposureModeCustom(duration: duration, iso: clampedISO, completionHandler: nil)
                      }
                      if lockFocus && device.isFocusModeSupported(.locked) {
                          let safeDist: Float = max(Float(0.05), focusDistanceMeters)
                          let denom: Float = Float(1.0) + (safeDist * Float(1.6))
                          let rawPos: Float = Float(1.0) - (Float(1.0) / denom)
                          let clampedPos: Float = min(max(rawPos, Float(0.0)), Float(1.0))
                          device.setFocusModeLocked(lensPosition: clampedPos, completionHandler: nil)
                      }
                      device.unlockForConfiguration()
                  } catch {
                      print("Manual exposure/focus lock error: \(error.localizedDescription)")
                  }
              }
          
              private func configureSession(for lens: iPhone13ProMaxLens) {
                  captureSession.beginConfiguration()
                  captureSession.sessionPreset = .photo
          
                  if let existingInput = videoDeviceInput {
                      captureSession.removeInput(existingInput)
                      videoDeviceInput = nil
                  }
          
                  //Clear old depth texture when switching lenses
                  textureLock.lock()
                  _latestDepthTexture = nil
                  textureLock.unlock()
          
                  guard let cameraDevice = AVCaptureDevice.default(lens.avDeviceType, for: .video, position: .back)
                      ?? AVCaptureDevice.default(.builtInWideAngleCamera, for: .video, position: .back) else {
                      captureSession.commitConfiguration()
                      DispatchQueue.main.async {
                          self.statusMessage = "Simulator/No Sensor Detected — Real-time Synthetic Optical Scene Active"
                      }
                      return
                  }
          
                  do {
                      let input = try AVCaptureDeviceInput(device: cameraDevice)
                      if captureSession.canAddInput(input) {
                          captureSession.addInput(input)
                          videoDeviceInput = input
                      }
                  } catch {
                      captureSession.commitConfiguration()
                      return
                  }
          
                  // Default to Continuous Auto-Exposure & Continuous Auto-Focus on startup so image is immediately well-exposed and sharp
                  do {
                      try cameraDevice.lockForConfiguration()
                      if cameraDevice.isExposureModeSupported(.continuousAutoExposure) {
                          cameraDevice.exposureMode = .continuousAutoExposure
                      }
                      if cameraDevice.isFocusModeSupported(.continuousAutoFocus) {
                          cameraDevice.focusMode = .continuousAutoFocus
                      }
                      cameraDevice.unlockForConfiguration()
                  } catch {}
          
                  // Video Data Output (BGRA8Unorm mapped via zero-copy CVMetalTextureCache)
                  if !captureSession.outputs.contains(videoDataOutput) {
                      videoDataOutput.videoSettings = [
                          kCVPixelBufferPixelFormatTypeKey as String: Int(kCVPixelFormatType_32BGRA),
                          kCVPixelBufferMetalCompatibilityKey as String: true
                      ]
                      videoDataOutput.alwaysDiscardsLateVideoFrames = true
                      if captureSession.canAddOutput(videoDataOutput) {
                          captureSession.addOutput(videoDataOutput)
                      }
                  }
          
                  // Photo Output for 12-bit Pure Bayer RAW (`kCVPixelFormatType_14Bayer_RGGB`) & Apple ProRAW
                  if !captureSession.outputs.contains(photoOutput) {
                      if captureSession.canAddOutput(photoOutput) {
                          captureSession.addOutput(photoOutput)
                          photoOutput.maxPhotoDimensions = CMVideoDimensions(width: 4032, height: 3024)
                          if photoOutput.isAppleProRAWSupported {
                              photoOutput.isAppleProRAWEnabled = !usePureBayerRAWOverProRAW
                          }
                          if photoOutput.isDepthDataDeliverySupported {
                              photoOutput.isDepthDataDeliveryEnabled = true
                          }
                      }
                  }
          
                  // LiDAR / Dual-Pixel Depth Output
                  if !captureSession.outputs.contains(depthDataOutput) {
                      depthDataOutput.isFilteringEnabled = true
                      if captureSession.canAddOutput(depthDataOutput) {
                          captureSession.addOutput(depthDataOutput)
                      }
                  }
          
                  if let connection = videoDataOutput.connection(with: .video), connection.isVideoOrientationSupported {
                      connection.videoOrientation = .portrait
                  }
          
                  if captureSession.outputs.contains(depthDataOutput) && !cameraDevice.activeFormat.supportedDepthDataFormats.isEmpty {
                      outputSynchronizer = AVCaptureDataOutputSynchronizer(dataOutputs: [videoDataOutput, depthDataOutput])
                      outputSynchronizer?.setDelegate(self, queue: dataOutputQueue)
                  } else {
                      outputSynchronizer = nil
                      videoDataOutput.setSampleBufferDelegate(self, queue: dataOutputQueue)
                  }
          
                  captureSession.commitConfiguration()
          
                  if !captureSession.isRunning {
                      captureSession.startRunning()
                  }
          
                  let rawCount = photoOutput.availableRawPhotoPixelFormatTypes.count
                  DispatchQueue.main.async {
                      self.isSessionRunning = self.captureSession.isRunning
                      self.isAutoExposureEnabled = true
                      self.isAutoFocusEnabled = true
                      self.statusMessage = "\(lens.rawValue) • 12-bit RAW Formats: \(rawCount) • Zero-Copy Metal Active"
                  }
              }
          
              /// Triggers a 12-bit Pure Bayer RAW (or ProRAW) capture + renders the full-precision darkroom print
              func capture12BitRAWAndDevelopPrint(
                  recipe: DarkroomNegativeRecipe,
                  renderedPrintSnapshot: UIImage?
              ) {
                  MechanicalHapticsAndMotion.shared.playMechanicalShutterRelease(shutterDurationSeconds: Double(recipe.shutterSpeedSeconds))
          
                  if let printImg = renderedPrintSnapshot {
                      DispatchQueue.main.async {
                          self.latestCapturedPreviewImage = printImg
                          self.capturedRollsCount += 1
                      }
                      saveDevelopedPrintAndRecipeToPhotoLibrary(dngData: nil, printImage: printImg, recipe: recipe)
                  }
          
                  sessionQueue.async {
                      guard self.captureSession.isRunning else { return }
                      self.photoOutput.isAppleProRAWEnabled = self.photoOutput.isAppleProRAWSupported && !self.usePureBayerRAWOverProRAW
          
                      let availableRAW = self.photoOutput.availableRawPhotoPixelFormatTypes
                      let photoSettings: AVCapturePhotoSettings
          
                      if let selectedRAWFormat = availableRAW.first(where: {
                          self.usePureBayerRAWOverProRAW ? !AVCapturePhotoOutput.isAppleProRAWPixelFormat($0) : AVCapturePhotoOutput.isAppleProRAWPixelFormat($0)
                      }) ?? availableRAW.first {
                          photoSettings = AVCapturePhotoSettings(
                              rawPixelFormatType: selectedRAWFormat,
                              processedFormat: [AVVideoCodecKey: AVVideoCodecType.hevc]
                          )
                      } else {
                          photoSettings = AVCapturePhotoSettings(format: [AVVideoCodecKey: AVVideoCodecType.hevc])
                      }
          
                      photoSettings.maxPhotoDimensions = self.photoOutput.maxPhotoDimensions
                      photoSettings.photoQualityPrioritization = .quality
          
                      let processor = RAWPhotoCaptureProcessor(uid: photoSettings.uniqueID) { [weak self] dngData in
                          guard let self = self else { return }
                          self.inFlightPhotoDelegates.removeValue(forKey: photoSettings.uniqueID)
                          if let dng = dngData {
                              self.saveDNGNegativeToDocuments(dngData: dng, recipe: recipe)
                          }
                      }
                      self.inFlightPhotoDelegates[photoSettings.uniqueID] = processor
                      self.photoOutput.capturePhoto(with: photoSettings, delegate: processor)
                  }
              }
          
              private func saveDNGNegativeToDocuments(dngData: Data, recipe: DarkroomNegativeRecipe) {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!
                  let baseName = "Negative_\(Int(recipe.captureTimestamp.timeIntervalSince1970))"
                  let dngURL = docs.appendingPathComponent("\(baseName).dng")
                  let sidecarURL = docs.appendingPathComponent("\(baseName).json")
                  try? dngData.write(to: dngURL, options: .atomic)
                  if let jsonData = try? JSONEncoder().encode(recipe) {
                      try? jsonData.write(to: sidecarURL, options: .atomic)
                  }
              }
          
              private func saveDevelopedPrintAndRecipeToPhotoLibrary(dngData: Data?, printImage: UIImage, recipe: DarkroomNegativeRecipe) {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!
                  let sidecarURL = docs.appendingPathComponent("Recipe_\(recipe.id.uuidString).json")
                  if let jsonData = try? JSONEncoder().encode(recipe) {
                      try? jsonData.write(to: sidecarURL, options: .atomic)
                  }
          
                  PHPhotoLibrary.requestAuthorization(for: .addOnly) { status in
                      guard status == .authorized || status == .limited else { return }
                      PHPhotoLibrary.shared().performChanges({
                          let creationRequest = PHAssetCreationRequest.forAsset()
                          if let pngData = printImage.pngData() {
                              creationRequest.addResource(with: .photo, data: pngData, options: nil)
                          }
                          if let rawDNG = dngData {
                              let rawOptions = PHAssetResourceCreationOptions()
                              rawOptions.originalFilename = "HalideLab_12Bit.dng"
                              creationRequest.addResource(with: .alternatePhoto, data: rawDNG, options: rawOptions)
                          }
                      }, completionHandler: nil)
                  }
              }
          
              private func pollHardwareExposureTelemetry() {
                  guard let device = videoDeviceInput?.device else { return }
                  let currentISO: Float = device.iso
                  let currentSec: Float = Float(CMTimeGetSeconds(device.exposureDuration))
                  if currentSec > 0.0 && !currentSec.isNaN {
                      DispatchQueue.main.async {
                          self.liveHardwareISO = currentISO
                          self.liveHardwareShutterSeconds = currentSec
                      }
                  }
              }
          }
          
          extension CameraCapturePipeline: AVCaptureVideoDataOutputSampleBufferDelegate, AVCaptureDataOutputSynchronizerDelegate {
              func dataOutputSynchronizer(
                  _ synchronizer: AVCaptureDataOutputSynchronizer,
                  didOutput synchronizedDataCollection: AVCaptureSynchronizedDataCollection
              ) {
                  if let syncedVideo = synchronizedDataCollection.synchronizedData(for: videoDataOutput) as? AVCaptureSynchronizedSampleBufferData,
                     !syncedVideo.sampleBufferWasDropped,
                     let pixelBuffer = CMSampleBufferGetImageBuffer(syncedVideo.sampleBuffer) {
                      updateCameraMetalTexture(from: pixelBuffer)
                      pollHardwareExposureTelemetry()
                  }
          
                  if let syncedDepth = synchronizedDataCollection.synchronizedData(for: depthDataOutput) as? AVCaptureSynchronizedDepthData,
                     !syncedDepth.depthDataWasDropped {
                      let convertedDepth = syncedDepth.depthData.converting(toDepthDataType: kCVPixelFormatType_DepthFloat32)
                      updateDepthMetalTexture(from: convertedDepth.depthDataMap)
                  }
              }
          
              func captureOutput(
                  _ output: AVCaptureOutput,
                  didOutput sampleBuffer: CMSampleBuffer,
                  from connection: AVCaptureConnection
              ) {
                  guard let pixelBuffer = CMSampleBufferGetImageBuffer(sampleBuffer) else { return }
                  updateCameraMetalTexture(from: pixelBuffer)
                  pollHardwareExposureTelemetry()
              }
          
              private func updateCameraMetalTexture(from pixelBuffer: CVPixelBuffer) {
                  guard let cache = textureCache else { return }
                  let width = CVPixelBufferGetWidth(pixelBuffer)
                  let height = CVPixelBufferGetHeight(pixelBuffer)
                  var cvTexOut: CVMetalTexture?
                  let status = CVMetalTextureCacheCreateTextureFromImage(
                      kCFAllocatorDefault,
                      cache,
                      pixelBuffer,
                      nil,
                      .bgra8Unorm,
                      width,
                      height,
                      0,
                      &cvTexOut
                  )
                  if status == kCVReturnSuccess, let cvTex = cvTexOut, let mtlTex = CVMetalTextureGetTexture(cvTex) {
                      textureLock.lock()
                      _latestCameraTexture = mtlTex
                      textureLock.unlock()
                  }
              }
          
              private func updateDepthMetalTexture(from depthBuffer: CVPixelBuffer) {
                  guard let cache = textureCache else { return }
                  let width = CVPixelBufferGetWidth(depthBuffer)
                  let height = CVPixelBufferGetHeight(depthBuffer)
                  var cvTexOut: CVMetalTexture?
                  let status = CVMetalTextureCacheCreateTextureFromImage(
                      kCFAllocatorDefault,
                      cache,
                      depthBuffer,
                      nil,
                      .r32Float,
                      width,
                      height,
                      0,
                      &cvTexOut
                  )
                  if status == kCVReturnSuccess, let cvTex = cvTexOut, let mtlTex = CVMetalTextureGetTexture(cvTex) {
                      textureLock.lock()
                      _latestDepthTexture = mtlTex
                      textureLock.unlock()
                  }
              }
          }
          
          private final class RAWPhotoCaptureProcessor: NSObject, AVCapturePhotoCaptureDelegate {
              let uid: Int64
              private let completion: (Data?) -> Void
              private var capturedDNGData: Data?
          
              init(uid: Int64, completion: @escaping (Data?) -> Void) {
                  self.uid = uid
                  self.completion = completion
              }
          
              func photoOutput(_ output: AVCapturePhotoOutput, didFinishProcessingPhoto photo: AVCapturePhoto, error: Error?) {
                  if photo.isRawPhoto {
                      capturedDNGData = photo.fileDataRepresentation()
                  }
              }
          
              func photoOutput(_ output: AVCapturePhotoOutput, didFinishCaptureFor resolvedSettings: AVCaptureResolvedPhotoSettings, error: Error?) {
                  completion(capturedDNGData)
              }
          }
