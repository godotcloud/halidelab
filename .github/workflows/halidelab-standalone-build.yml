              private let textureLock = NSLock()
              private var _latestCameraTexture: MTLTexture?
          
              var latestTextures: (camera: MTLTexture?, depth: MTLTexture?) {
                  textureLock.lock()
                  defer { textureLock.unlock() }
                  return (_latestCameraTexture, nil)
              }
          
              func bindMetalDevice(_ device: MTLDevice) {
                  self.metalDevice = device
                  var cache: CVMetalTextureCache?
                  CVMetalTextureCacheCreate(kCFAllocatorDefault, nil, device, nil, &cache)
                  self.textureCache = cache
              }
          
              func requestPermissionsAndStart() {
                  switch AVCaptureDevice.authorizationStatus(for: .video) {
                  case .authorized:
                      sessionQueue.async { self.configureSession(for: self.activeLens) }
                  case .notDetermined:
                      AVCaptureDevice.requestAccess(for: .video) { granted in
                          if granted {
                              self.sessionQueue.async { self.configureSession(for: self.activeLens) }
                          } else {
                              DispatchQueue.main.async {
                                  self.statusMessage = "Camera Permission Denied — Running Synthetic Optical Test Chart"
                              }
                          }
                      }
                  default:
                      DispatchQueue.main.async {
                          self.statusMessage = "Camera Unavailable — Running Synthetic Optical Test Chart"
                      }
                  }
              }
          
              func switchOpticalLens(_ newLens: iPhone13ProMaxLens) {
                  guard newLens != activeLens else { return }
                  DispatchQueue.main.async { self.activeLens = newLens }
                  MechanicalHapticsAndMotion.shared.playApertureDetentClick(intensity: 0.90, sharpness: 0.95)
                  sessionQueue.async {
                      self.configureSession(for: newLens)
                  }
              }
          
              func enableAperturePriorityAutoExposure() {
                  DispatchQueue.main.async { self.isAutoExposureEnabled = true }
                  sessionQueue.async { [weak self] in
                      guard let self = self, let device = self.videoDeviceInput?.device else { return }
                      do {
                          try device.lockForConfiguration()
                          if device.isExposureModeSupported(.continuousAutoExposure) {
                              device.exposureMode = .continuousAutoExposure
                          }
                          device.unlockForConfiguration()
                      } catch {}
                  }
              }
          
              func setHardwareExposureBiasEV(_ biasEV: Float) {
                  sessionQueue.async { [weak self] in
                      guard let self = self, let device = self.videoDeviceInput?.device else { return }
                      do {
                          try device.lockForConfiguration()
                          let minBias: Float = device.minExposureTargetBias
                          let maxBias: Float = device.maxExposureTargetBias
                          let clampedBias: Float = min(max(biasEV, minBias), maxBias)
                          device.setExposureTargetBias(clampedBias, completionHandler: nil)
                          device.unlockForConfiguration()
                      } catch {}
                  }
              }
          
              func toggleAutoFocusMode() {
                  let newAF = !isAutoFocusEnabled
                  DispatchQueue.main.async { self.isAutoFocusEnabled = newAF }
                  sessionQueue.async { [weak self] in
                      guard let self = self, let device = self.videoDeviceInput?.device else { return }
                      do {
                          try device.lockForConfiguration()
                          if newAF && device.isFocusModeSupported(.continuousAutoFocus) {
                              device.focusMode = .continuousAutoFocus
                          }
                          device.unlockForConfiguration()
                      } catch {}
                  }
              }
          
              func setFocusPointOfInterest(normalizedUV: SIMD2<Float>) {
                  sessionQueue.async { [weak self] in
                      guard let self = self, let device = self.videoDeviceInput?.device else { return }
                      do {
                          try device.lockForConfiguration()
                          let pt = CGPoint(x: Double(normalizedUV.x), y: Double(normalizedUV.y))
                          if device.isFocusPointOfInterestSupported {
                              device.focusPointOfInterest = pt
                              if device.isFocusModeSupported(.autoFocus) {
                                  device.focusMode = .autoFocus
                              }
                          }
                          if device.isExposurePointOfInterestSupported && self.isAutoExposureEnabled {
                              device.exposurePointOfInterest = pt
                              if device.isExposureModeSupported(.continuousAutoExposure) {
                                  device.exposureMode = .continuousAutoExposure
                              }
                          }
                          device.unlockForConfiguration()
                      } catch {}
                  }
              }
          
              func setWhiteBalanceKelvin(_ kelvin: Float, locked: Bool) {
                  DispatchQueue.main.async {
                      self.colorTemperatureKelvin = kelvin
                      self.isWhiteBalanceLocked = locked
                      if !locked {
                          self.colorTemperatureKelvin = 5500.0
                          self.whiteBalanceTint = 0.0
                      }
                  }
                  sessionQueue.async { [weak self] in
                      guard let self = self, let device = self.videoDeviceInput?.device else { return }
                      do {
                          try device.lockForConfiguration()
                          if device.isWhiteBalanceModeSupported(.continuousAutoWhiteBalance) {
                              device.whiteBalanceMode = .continuousAutoWhiteBalance
                          }
                          device.unlockForConfiguration()
                      } catch {}
                  }
              }
          
              func setManualExposureAndFocus(iso: Float, shutterSeconds: Float, focusDistanceMeters: Float, lockExposure: Bool, lockFocus: Bool) {
                  DispatchQueue.main.async {
                      if lockExposure { self.isAutoExposureEnabled = false }
                      if lockFocus { self.isAutoFocusEnabled = false }
                  }
                  sessionQueue.async { [weak self] in
                      self?.applyHardwareExposureAndFocus(
                          iso: iso,
                          shutterSeconds: shutterSeconds,
                          focusDistanceMeters: focusDistanceMeters,
                          lockExposure: lockExposure,
                          lockFocus: lockFocus
                      )
                  }
              }
          
              private func applyHardwareExposureAndFocus(
                  iso: Float,
                  shutterSeconds: Float,
                  focusDistanceMeters: Float,
                  lockExposure: Bool,
                  lockFocus: Bool
              ) {
                  guard let device = self.videoDeviceInput?.device else { return }
                  do {
                      try device.lockForConfiguration()
                      if lockExposure && device.isExposureModeSupported(.custom) {
                          let minISO: Float = device.activeFormat.minISO
                          let maxISO: Float = device.activeFormat.maxISO
                          let clampedISO: Float = min(max(iso, minISO), maxISO)
          
                          let minDur: Double = CMTimeGetSeconds(device.activeFormat.minExposureDuration)
                          let maxDur: Double = CMTimeGetSeconds(device.activeFormat.maxExposureDuration)
                          let requestedSec: Double = Double(shutterSeconds)
                          let clampedSec: Double = min(max(requestedSec, minDur), maxDur)
                          let duration: CMTime = CMTimeMakeWithSeconds(clampedSec, preferredTimescale: 1_000_000)
          
                          device.setExposureModeCustom(duration: duration, iso: clampedISO, completionHandler: nil)
                      }
                      if lockFocus && device.isFocusModeSupported(.locked) {
                          let safeDist: Float = max(Float(0.05), focusDistanceMeters)
                          let denom: Float = Float(1.0) + (safeDist * Float(1.6))
                          let rawPos: Float = Float(1.0) - (Float(1.0) / denom)
                          let clampedPos: Float = min(max(rawPos, Float(0.0)), Float(1.0))
                          device.setFocusModeLocked(lensPosition: clampedPos, completionHandler: nil)
                      }
                      device.unlockForConfiguration()
                  } catch {
                      print("Manual exposure/focus lock error: \(error.localizedDescription)")
                  }
              }
          
              private func configureSession(for lens: iPhone13ProMaxLens) {
                  captureSession.beginConfiguration()
                  captureSession.sessionPreset = .photo
          
                  if let existingInput = videoDeviceInput {
                      captureSession.removeInput(existingInput)
                      videoDeviceInput = nil
                  }
          
                  guard let cameraDevice = AVCaptureDevice.default(lens.avDeviceType, for: .video, position: .back)
                      ?? AVCaptureDevice.default(.builtInWideAngleCamera, for: .video, position: .back) else {
                      captureSession.commitConfiguration()
                      DispatchQueue.main.async {
                          self.statusMessage = "Simulator/No Sensor Detected — Real-time Synthetic Optical Scene Active"
                      }
                      return
                  }
          
                  do {
                      let input = try AVCaptureDeviceInput(device: cameraDevice)
                      if captureSession.canAddInput(input) {
                          captureSession.addInput(input)
                          videoDeviceInput = input
                      }
                  } catch {
                      captureSession.commitConfiguration()
                      return
                  }
          
                  // Enable Continuous Auto-Exposure, Auto-Focus, and Auto-White-Balance on hardware sensor
                  do {
                      try cameraDevice.lockForConfiguration()
                      if cameraDevice.isExposureModeSupported(.continuousAutoExposure) {
                          cameraDevice.exposureMode = .continuousAutoExposure
                      }
                      if cameraDevice.isFocusModeSupported(.continuousAutoFocus) {
                          cameraDevice.focusMode = .continuousAutoFocus
                      }
                      if cameraDevice.isWhiteBalanceModeSupported(.continuousAutoWhiteBalance) {
                          cameraDevice.whiteBalanceMode = .continuousAutoWhiteBalance
                      }
                      cameraDevice.unlockForConfiguration()
                  } catch {}
          
                  if !captureSession.outputs.contains(videoDataOutput) {
                      videoDataOutput.videoSettings = [
                          kCVPixelBufferPixelFormatTypeKey as String: Int(kCVPixelFormatType_32BGRA),
                          kCVPixelBufferMetalCompatibilityKey as String: true
                      ]
                      videoDataOutput.alwaysDiscardsLateVideoFrames = true
                      if captureSession.canAddOutput(videoDataOutput) {
                          captureSession.addOutput(videoDataOutput)
                      }
                  }
          
                  if let connection = videoDataOutput.connection(with: .video), connection.isVideoOrientationSupported {
                      connection.videoOrientation = .portrait
                  }
          
                  videoDataOutput.setSampleBufferDelegate(self, queue: dataOutputQueue)
                  captureSession.commitConfiguration()
          
                  if !captureSession.isRunning {
                      captureSession.startRunning()
                  }
          
                  DispatchQueue.main.async {
                      self.isSessionRunning = self.captureSession.isRunning
                      self.isAutoExposureEnabled = true
