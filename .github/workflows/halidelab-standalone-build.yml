              float multigradeFilterNumber;   // 0.0 (Grade 00), 2.0 (Grade 2), 5.0 (Grade 5)
              int32_t enableSplitGrade;       // 1 = Split-grade two-pass exposure (Soft Grade 00 + Hard Grade 5)
              float splitGradeSoftBalance;    // Ratio of Grade 00 to Grade 5 exposure
              
              // Paper Sensitometry (Kodak Endura Premier / Ektacolor Edge / Ilford Multigrade RC/FB)
              float paperDMinRGB[3];          // Paper base white reflectance density (e.g. Warmtone vs Neutral vs Pearl)
              float paperDMaxRGB[3];          // Deep silver/dye black maximum reflection density (~2.15 - 2.25)
              float paperGamma;               // Intrinsic paper slope
              
              // Physical Dodging & Burning Interactive Radial Tool
