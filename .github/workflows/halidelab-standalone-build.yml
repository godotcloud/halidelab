          /// Non-Destructive Sidecar Recipe stored alongside every captured Print & Negative
          struct DarkroomNegativeRecipe: Codable, Identifiable {
              var id: UUID = UUID()
              var captureTimestamp: Date = Date()
              var lensFocalLengthMM: Float
              var simulatedApertureFNumber: Float
              var shutterSpeedSeconds: Float
              var exposureBiasEV: Float
              var filmStockID: String
              var filmFormatName: String
              var ratedEI: Float
              var developerFormulaID: String
              var developerTemperatureC: Float
              var developmentTimeScale: Float
              var agitationFactor: Float
              var enlargerHeadTypeRaw: Int32
              var enlargerExposureEV: Float
              var filterYellowCC: Float
              var filterMagentaCC: Float
              var filterCyanCC: Float
              var multigradeFilterNumber: Float
              var enableSplitGrade: Bool
              var splitGradeSoftBalance: Float
              var paperID: String
              var chemicalTonerRaw: Int32
              var tonerIntensity: Float
              var dodgeBurnCenterX: Float
              var dodgeBurnCenterY: Float
              var dodgeBurnRadius: Float
              var dodgeBurnStops: Float
          }
          EOF_HALIDE_FILE

          cat << 'EOF_HALIDE_FILE' > "HalideLabPro/Bridge/ShaderBridgeTypes.h"
          #ifndef ShaderBridgeTypes_h
          #define ShaderBridgeTypes_h
          
          #include <simd/simd.h>
          
          #ifdef __METAL_VERSION__
          #define NS_ENUM(_type, _name) enum _name : _type _name; enum _name : _type
          #define NSInteger metal::int32_t
          #include <metal_stdlib>
          using namespace metal;
          typedef float2 BridgeFloat2;
          typedef float3 BridgeFloat3;
          typedef float3x3 BridgeFloat3x3;
          #else
          #import <Foundation/Foundation.h>
          typedef simd_float2 BridgeFloat2;
          typedef simd_float3 BridgeFloat3;
          typedef simd_float3x3 BridgeFloat3x3;
          #endif
          
          // Grain Morphology Enum matching authentic silver halide crystal structures
          typedef NS_ENUM(int32_t, GrainMorphologyType) {
              GrainMorphologyCubic      = 0, // Classic Cubic Crystal (e.g. Kodak Tri-X 400, Ilford HP5 Plus, Pan F+ 50)
              GrainMorphologyTabular    = 1, // Flat T-Grain / Sub-Micron Crystal (e.g. Portra, T-Max, Ektar, Vision3)
              GrainMorphologyFineE6     = 2, // Ultra-fine Reversal Coupler Micelles (e.g. Velvia 50, Provia 100F, Ektachrome E100)
              GrainMorphologyCoreShell  = 3  // Ilford Core-Shell / Fujifilm Super Fine-Sigma (e.g. Delta 3200, Acros 100 II)
          };
          
          // Film Process Chemistry Type
          typedef NS_ENUM(int32_t, FilmProcessType) {
              FilmProcessC41ColorNegative     = 0, // Standard Color Negative (37.8°C)
              FilmProcessBWMonochromeNegative = 1, // Black & White Silver Halide (20.0°C)
              FilmProcessE6ColorReversal      = 2, // Slide / Reversal Positive (38.0°C)
              FilmProcessECN2CinemaNegative   = 3, // Motion Picture Negative with Remjet (41.1°C)
              FilmProcessC41CrossRemjetFree   = 4  // CineStill 800T Remjet-Free C-41 Cross-Process
          };
          
          // Darkroom Enlarger Light Source Type
          typedef NS_ENUM(int32_t, EnlargerLightHeadType) {
              EnlargerLightCondenser = 0, // Point source + Condenser lenses (High Callier Factor Q ~ 1.14, crisp grain)
              EnlargerLightDiffuser  = 1  // Dichroic mixing box / Cold cathode (Callier Factor Q ~ 1.00, smooth tonal transitions)
          };
          
          // Darkroom Chemical Toner Type
          typedef NS_ENUM(int32_t, ChemicalTonerType) {
              ChemicalTonerNone     = 0,
              ChemicalTonerSelenium = 1, // Kodak Rapid Selenium Toner (1+19): deepens Dmax (+0.15) & cool eggplant shadow tint
              ChemicalTonerSepia    = 2, // Sulfide Bleach & Redevelop: warm chestnut midtones
              ChemicalTonerGold     = 3, // Gold Chloride protective blue-black shift
              ChemicalTonerPlatinum = 4  // Platinum / Palladium warm split-tone print
          };
          
          // Classic Screw-In Optical Glass Filter Type (Kodak Wratten Series)
          typedef NS_ENUM(int32_t, OpticalGlassFilterType) {
              OpticalGlassFilterNone          = 0, // Unfiltered Clear / UV
              OpticalGlassFilterYellowK2      = 1, // Wratten #8 Yellow K2 (-1.0 EV Blue, natural sky/foliage separation)
              OpticalGlassFilterOrangeG15     = 2, // Wratten #15 Deep Yellow-Orange (-1.5 EV Blue/Green, dramatic clouds & smooth skin)
              OpticalGlassFilterRed25         = 3, // Wratten #25A Tricolor Red (-3.0 EV Blue/Green, high-contrast black skies)
              OpticalGlassFilterGreenX1       = 4, // Wratten #11 Yellow-Green (+foliage luminance, rich portrait skin tones)
              OpticalGlassFilterBlue80A       = 5, // Wratten #80A Cooling Filter (3200K Tungsten -> 5500K Daylight conversion)
              OpticalGlassFilterWarm85B       = 6  // Wratten #85B Warming Filter (5500K Daylight -> 3200K Tungsten conversion for 500T/800T)
          };
          
          // Stage 1: Physical Optics Uniforms (iPhone 13 Pro Max 13mm / 26mm / 77mm + Simulated Mechanical Lens)
          struct PhysicalOpticsUniforms {
