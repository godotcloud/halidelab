          // Signed Distance / Weight of a mechanical N-blade iris diaphragm with blade curvature
          inline float aperturePolygonWeight(float2 sampleOffset, int bladeCount, float curvature) {
              float r = length(sampleOffset);
              if (r < 1e-4f) return 1.0f;
              float theta = atan2(sampleOffset.y, sampleOffset.x);
              float sector = 2.0f * M_PI_F / float(max(bladeCount, 5));
              float halfSector = 0.5f * sector;
              float localAngle = fmod(theta + 2.0f * M_PI_F, sector) - halfSector;
              float polyRadius = cos(halfSector) / max(cos(localAngle), 0.1f);
              float effectiveRadius = mix(polyRadius, 1.0f, clamp(curvature, 0.0f, 1.0f));
              return smoothstep(effectiveRadius, effectiveRadius * 0.82f, r);
