              private func buildComputePipelines() {
                  guard let library = device.makeDefaultLibrary() else {
                      fatalError("Failed to load compiled AnalogPipelineShaders.metallib")
                  }
                  do {
                      opticsPipeline = try device.makeComputePipelineState(function: library.makeFunction(name: "k_physical_optics_pass")!)
                      emulsionPipeline = try device.makeComputePipelineState(function: library.makeFunction(name: "k_film_emulsion_pass")!)
                      darkroomPrintPipeline = try device.makeComputePipelineState(function: library.makeFunction(name: "k_darkroom_enlarger_print_pass")!)
                  } catch {
                      fatalError("Metal compute pipeline compilation error: \(error)")
                  }
              }
          
              private func buildSyntheticFallbackTextures() {
                  let w = 720
                  let h = 960
                  let camDesc = MTLTextureDescriptor.texture2DDescriptor(pixelFormat: .rgba8Unorm, width: w, height: h, mipmapped: false)
                  camDesc.usage = [.shaderRead]
                  let camTex = device.makeTexture(descriptor: camDesc)!
          
                  let depthDesc = MTLTextureDescriptor.texture2DDescriptor(pixelFormat: .r32Float, width: w, height: h, mipmapped: false)
                  depthDesc.usage = [.shaderRead]
                  let dTex = device.makeTexture(descriptor: depthDesc)!
          
                  var rgbaBytes = [UInt8](repeating: 0, count: w * h * 4)
                  var depthFloats = [Float](repeating: 1.2, count: w * h)
          
                  for y in 0..<h {
                      let ny = Float(y) / Float(h)
                      for x in 0..<w {
                          let nx = Float(x) / Float(w)
                          let idx = (y * w + x) * 4
          
                          let dx = nx - 0.5
                          let dy = (ny - 0.45) * 1.33
                          let dist = sqrt(dx * dx + dy * dy)
          
                          var r: Float = 0.14 + 0.25 * (1.0 - ny)
                          var g: Float = 0.16 + 0.18 * nx
                          var b: Float = 0.22 + 0.30 * ny
                          var z: Float = 4.5
          
                          if dist < 0.26 {
                              let radSq: Float = max(Float(0.0), Float(0.0676) - dist * dist)
                              let sphereZ: Float = sqrt(radSq)
                              let dotTerm: Float = (dx * Float(-0.5)) + (dy * Float(-0.6)) + (sphereZ * Float(0.85))
                              let light: Float = max(Float(0.1), dotTerm / Float(0.26))
                              r = min(Float(1.0), Float(0.78) * light + Float(0.12))
                              g = min(Float(1.0), Float(0.56) * light + Float(0.08))
                              b = min(Float(1.0), Float(0.44) * light + Float(0.06))
                              z = Float(1.2) - sphereZ * Float(0.5)
                          }
          
                          let lights: [(Float, Float, Float, Float, Float)] = [
                              (0.18, 0.20, 1.0, 0.85, 0.55),
                              (0.82, 0.18, 1.0, 0.35, 0.20),
                              (0.76, 0.75, 0.45, 0.85, 1.0),
                              (0.22, 0.78, 1.0, 0.92, 0.70)
                          ]
                          for l in lights {
                              let ldx = nx - l.0
                              let ldy = (ny - l.1) * 1.33
                              let lDist = sqrt(ldx * ldx + ldy * ldy)
                              if lDist < 0.028 {
                                  r = l.2
                                  g = l.3
                                  b = l.4
                                  z = 8.0
                              }
                          }
          
                          rgbaBytes[idx + 0] = UInt8(clamping: Int(r * 255.0))
                          rgbaBytes[idx + 1] = UInt8(clamping: Int(g * 255.0))
                          rgbaBytes[idx + 2] = UInt8(clamping: Int(b * 255.0))
                          rgbaBytes[idx + 3] = 255
                          depthFloats[y * w + x] = z
                      }
                  }
          
                  camTex.replace(region: MTLRegionMake2D(0, 0, w, h), mipmapLevel: 0, withBytes: rgbaBytes, bytesPerRow: w * 4)
                  dTex.replace(region: MTLRegionMake2D(0, 0, w, h), mipmapLevel: 0, withBytes: depthFloats, bytesPerRow: w * 4)
                  self.syntheticCameraTexture = camTex
                  self.syntheticDepthTexture = dTex
              }
          
              func applyLensCharacterPreset(_ preset: OpticalLensCharacterPreset) {
                  selectedLensPreset = preset
                  apertureBladeCount = preset.bladeCount
                  bladeCurvature = preset.bladeCurvature
                  sphericalAberration = preset.sphericalAberration
                  opticalVignettingCatEye = preset.catEyeVignetting
                  cosFourthFalloffStrength = preset.cosFourthFalloff
                  lateralChromaticAberration = preset.lateralCA
                  asphericalOnionRingIntensity = preset.onionRingIntensity
                  anamorphicSqueezeFactor = preset.anamorphicSqueeze
                  radialSwirlPetzval = preset.petzvalSwirl
                  MechanicalHapticsAndMotion.shared.playApertureDetentClick()
              }
          
              func applyDeveloperPreset(_ dev: DeveloperFormulaPreset) {
                  selectedDeveloper = dev
                  developerTemperatureC = dev.defaultTempC
                  MechanicalHapticsAndMotion.shared.playApertureDetentClick()
              }
          
              func selectFilmStock(_ stock: FilmStockDescriptor) {
                  selectedFilm = stock
                  ratedEI = stock.nominalISO
                  developerTemperatureC = stock.defaultDeveloperTempC
                  developmentTimeScale = 1.0
                  if stock.processType == .bwMonochromeNegative {
                      if !selectedPaper.isMonochromeMultigrade {
                          selectedPaper = FilmStockDatabase.allPapers.first(where: { $0.isMonochromeMultigrade }) ?? selectedPaper
                      }
                      if selectedDeveloper.id == "c41_flexicolor" || selectedDeveloper.id == "ecn2_cinema" {
                          selectedDeveloper = FilmStockDatabase.allDevelopers.first(where: { $0.id == "kodak_d76_1_1" }) ?? selectedDeveloper
                      }
                  } else {
                      if selectedPaper.isMonochromeMultigrade {
                          selectedPaper = FilmStockDatabase.allPapers.first(where: { !$0.isMonochromeMultigrade }) ?? selectedPaper
                      }
                      selectedDeveloper = FilmStockDatabase.allDevelopers[0]
                  }
                  MechanicalHapticsAndMotion.shared.playFilmAdvanceLeverWind()
              }
          
              private func ensureIntermediateTextures(width: Int, height: Int) {
                  if let existing = opticsLinearTexture, existing.width == width, existing.height == height {
                      return
                  }
                  let desc = MTLTextureDescriptor.texture2DDescriptor(
                      pixelFormat: .rgba16Float,
                      width: width,
                      height: height,
                      mipmapped: false
                  )
                  desc.usage = [.shaderRead, .shaderWrite]
                  desc.storageMode = .private
                  opticsLinearTexture = device.makeTexture(descriptor: desc)
                  filmDensityTexture = device.makeTexture(descriptor: desc)
          
                  // Dedicated CPU+GPU shared BGRA8Unorm snapshot texture so photo saving never conflicts with CAMetalDrawable recycling
                  let snapDesc = MTLTextureDescriptor.texture2DDescriptor(
                      pixelFormat: .bgra8Unorm,
                      width: width,
                      height: height,
                      mipmapped: false
                  )
                  snapDesc.usage = [.shaderRead, .shaderWrite]
                  snapDesc.storageMode = .shared
                  snapshotLock.lock()
                  snapshotOutputTexture = device.makeTexture(descriptor: snapDesc)
                  snapshotLock.unlock()
              }
          
              func mtkView(_ view: MTKView, drawableSizeWillChange size: CGSize) {}
          
              func draw(in view: MTKView) {
                  guard let drawable = view.currentDrawable,
                        let commandBuffer = commandQueue.makeCommandBuffer() else { return }
          
                  let outTex = drawable.texture
                  let w = outTex.width
                  let h = outTex.height
                  ensureIntermediateTextures(width: w, height: h)
          
                  guard let opticsTex = opticsLinearTexture,
                        let densityTex = filmDensityTexture else { return }
          
                  let liveTextures = cameraPipeline?.latestTextures
                  let isUsingSyntheticScene = (liveTextures?.camera == nil)
                  let hasValidDepth = (liveTextures?.depth != nil) || isUsingSyntheticScene
                  let inCamTex = liveTextures?.camera ?? syntheticCameraTexture!
                  let inDepthTex = liveTextures?.depth ?? syntheticDepthTexture!
          
                  let activeLens = cameraPipeline?.activeLens ?? .wide26mm
                  let hwISO = cameraPipeline?.liveHardwareISO ?? ratedEI
                  let hwShutter = (cameraPipeline?.isAutoExposureEnabled == true)
                      ? (cameraPipeline?.liveHardwareShutterSeconds ?? shutterSpeedSeconds)
                      : shutterSpeedSeconds
          
                  let wbKelvin: Float = (cameraPipeline?.isWhiteBalanceLocked == true)
                      ? (cameraPipeline?.colorTemperatureKelvin ?? 5500.0)
                      : 5500.0
                  let wbTint: Float = cameraPipeline?.whiteBalanceTint ?? 0.0
          
                  var opticsU = PhysicalOpticsUniforms(
                      focalLengthMM: activeLens.focalLengthMM,
                      nativeApertureFNumber: activeLens.nativeApertureFNumber,
                      simulatedApertureFNumber: simulatedApertureFNumber,
                      focusDistanceMeters: focusDistanceMeters,
                      apertureBladeCount: apertureBladeCount,
                      bladeCurvature: bladeCurvature,
                      sphericalAberration: sphericalAberration,
                      opticalVignettingCatEye: opticalVignettingCatEye,
                      cosFourthFalloffStrength: cosFourthFalloffStrength,
                      lateralChromaticAberration: lateralChromaticAberration,
                      asphericalOnionRingIntensity: asphericalOnionRingIntensity,
                      halationBloomDiffusion: halationBloomDiffusion,
                      anamorphicSqueezeFactor: anamorphicSqueezeFactor,
                      radialSwirlPetzval: radialSwirlPetzval,
                      opticalGlassFilter: opticalGlassFilter.rawValue,
                      exposureBiasEV: exposureBiasEV,
                      enableLiDARBokeh: enableLiDARBokeh ? 1 : 0,
                      hasValidLiDARDepth: hasValidDepth ? 1 : 0,
                      focusPointUV: focusPointUV,
                      wbTemperatureKelvin: wbKelvin,
                      wbTintShift: wbTint,
                      realSensorISO: hwISO,
                      realSensorExposureSec: hwShutter
                  )
          
                  frameCounter &+= 1
                  var filmU = selectedFilm.buildUniforms(
                      ratedEI: ratedEI,
                      shutterSeconds: shutterSpeedSeconds,
                      devTempC: developerTemperatureC,
                      devTimeScale: developmentTimeScale,
                      agitation: agitationFactor,
                      grainSizeMult: selectedFilmFormat.grainScaleFactor,
                      devGammaMod: selectedDeveloper.gammaMod,
                      devGrainMod: selectedDeveloper.grainMod,
                      customHalationMult: customHalationMultiplier,
                      customEberhardMult: customEberhardMultiplier * selectedDeveloper.acutanceMod,
                      frameSeed: frameCounter
                  )
          
                  var darkroomU = DarkroomPrintUniforms(
                      enlargerHeadType: enlargerHeadType.rawValue,
                      enlargerExposureTimeEV: enlargerExposureTimeEV,
                      filterYellowCC: filterYellowCC,
                      filterMagentaCC: filterMagentaCC,
                      filterCyanCC: filterCyanCC,
                      multigradeFilterNumber: multigradeFilterNumber,
                      enableSplitGrade: enableSplitGrade ? 1 : 0,
                      splitGradeSoftBalance: splitGradeSoftBalance,
                      paperDMinRGB: (selectedPaper.dMinRGB.x, selectedPaper.dMinRGB.y, selectedPaper.dMinRGB.z),
                      paperDMaxRGB: (selectedPaper.dMaxRGB.x, selectedPaper.dMaxRGB.y, selectedPaper.dMaxRGB.z),
                      paperGamma: selectedPaper.intrinsicGamma,
                      preFlashExposureEV: preFlashExposureEV,
                      vignetteBurnEdgesEV: vignetteBurnEdgesEV,
                      dodgeBurnCenterUV: dodgeBurnCenterUV,
                      dodgeBurnRadius: dodgeBurnRadius,
                      dodgeBurnFeather: dodgeBurnFeather,
                      dodgeBurnStops: dodgeBurnStops,
                      chemicalToner: chemicalToner.rawValue,
                      tonerIntensity: tonerIntensity,
                      enableZoneFalseColor: enableZoneFalseColor ? 1 : 0,
                      enableFocusPeaking: enableFocusPeaking ? 1 : 0,
                      enableZebraWarnings: enableZebraWarnings ? 1 : 0,
                      spotMeterTargetUV: spotMeterTargetUV
                  )
          
                  let tgSize = MTLSize(width: 16, height: 16, depth: 1)
                  let gridSize = MTLSize(width: (w + 15) / 16 * 16, height: (h + 15) / 16 * 16, depth: 1)
          
                  if let computeEncoder = commandBuffer.makeComputeCommandEncoder() {
                      // Pass 1: Physical Optics
                      computeEncoder.setComputePipelineState(opticsPipeline)
                      computeEncoder.setTexture(inCamTex, index: 0)
                      computeEncoder.setTexture(inDepthTex, index: 1)
                      computeEncoder.setTexture(opticsTex, index: 2)
                      computeEncoder.setBytes(&opticsU, length: MemoryLayout<PhysicalOpticsUniforms>.stride, index: 0)
                      computeEncoder.dispatchThreads(gridSize, threadsPerThreadgroup: tgSize)
          
                      // Pass 2: Film Emulsion & Development Kinetics
                      computeEncoder.setComputePipelineState(emulsionPipeline)
                      computeEncoder.setTexture(opticsTex, index: 0)
                      computeEncoder.setTexture(densityTex, index: 1)
                      computeEncoder.setBytes(&filmU, length: MemoryLayout<FilmEmulsionUniforms>.stride, index: 0)
                      computeEncoder.dispatchThreads(gridSize, threadsPerThreadgroup: tgSize)
          
                      // Pass 3: Darkroom Enlarger & Photographic Paper Print
                      computeEncoder.setComputePipelineState(darkroomPrintPipeline)
                      computeEncoder.setTexture(densityTex, index: 0)
                      computeEncoder.setTexture(opticsTex, index: 1)
                      computeEncoder.setTexture(outTex, index: 2)
                      computeEncoder.setBytes(&opticsU, length: MemoryLayout<PhysicalOpticsUniforms>.stride, index: 0)
                      computeEncoder.setBytes(&filmU, length: MemoryLayout<FilmEmulsionUniforms>.stride, index: 1)
                      computeEncoder.setBytes(&darkroomU, length: MemoryLayout<DarkroomPrintUniforms>.stride, index: 2)
                      computeEncoder.setBuffer(telemetryBuffer, offset: 0, index: 3)
                      computeEncoder.dispatchThreads(gridSize, threadsPerThreadgroup: tgSize)
          
                      // Also render a clean, overlay-free copy to snapshotOutputTexture so shutter capture is always instant & crash-free
                      if let snapTex = snapshotOutputTexture {
                          var cleanDarkroomU = darkroomU
                          cleanDarkroomU.enableZoneFalseColor = 0
                          cleanDarkroomU.enableFocusPeaking = 0
                          cleanDarkroomU.enableZebraWarnings = 0
                          computeEncoder.setTexture(snapTex, index: 2)
                          computeEncoder.setBytes(&cleanDarkroomU, length: MemoryLayout<DarkroomPrintUniforms>.stride, index: 2)
                          computeEncoder.dispatchThreads(gridSize, threadsPerThreadgroup: tgSize)
                      }
          
                      computeEncoder.endEncoding()
                  }
          
                  commandBuffer.addCompletedHandler { [weak self] _ in
                      guard let self = self else { return }
                      let ptr = self.telemetryBuffer.contents().bindMemory(to: ZoneMeterTelemetry.self, capacity: 1)
                      let data = ptr.pointee
                      if self.frameCounter % 6 == 0 {
                          DispatchQueue.main.async {
                              self.currentAdamsZone = Int(data.adamsZoneIndex)
                              self.currentSpotEV100 = data.spotEV100
                              self.currentSpotDensityRGB = SIMD3<Float>(data.filmDensityRGB.0, data.filmDensityRGB.1, data.filmDensityRGB.2)
                          }
                      }
                  }
          
                  commandBuffer.present(drawable)
                  commandBuffer.commit()
              }
          
              func buildCurrentRecipe() -> DarkroomNegativeRecipe {
                  let lensMM = cameraPipeline?.activeLens.focalLengthMM ?? 26.0
                  return DarkroomNegativeRecipe(
                      lensFocalLengthMM: lensMM,
                      simulatedApertureFNumber: simulatedApertureFNumber,
                      shutterSpeedSeconds: shutterSpeedSeconds,
                      exposureBiasEV: exposureBiasEV,
                      filmStockID: selectedFilm.id,
                      filmFormatName: selectedFilmFormat.rawValue,
                      ratedEI: ratedEI,
                      developerFormulaID: selectedDeveloper.id,
                      developerTemperatureC: developerTemperatureC,
                      developmentTimeScale: developmentTimeScale,
                      agitationFactor: agitationFactor,
                      enlargerHeadTypeRaw: enlargerHeadType.rawValue,
                      enlargerExposureEV: enlargerExposureTimeEV,
                      filterYellowCC: filterYellowCC,
                      filterMagentaCC: filterMagentaCC,
                      filterCyanCC: filterCyanCC,
                      multigradeFilterNumber: multigradeFilterNumber,
                      enableSplitGrade: enableSplitGrade,
                      splitGradeSoftBalance: splitGradeSoftBalance,
                      paperID: selectedPaper.id,
                      chemicalTonerRaw: chemicalToner.rawValue,
                      tonerIntensity: tonerIntensity,
                      dodgeBurnCenterX: dodgeBurnCenterUV.x,
                      dodgeBurnCenterY: dodgeBurnCenterUV.y,
                      dodgeBurnRadius: dodgeBurnRadius,
                      dodgeBurnStops: dodgeBurnStops
                  )
              }
          
              /// Safely copies pixels from `snapshotOutputTexture` into a self-contained CGContext bitmap (`makeImage()`),
              /// guaranteeing zero dangling pointers and 100% thread-safe background JPEG/PNG encoding.
              func snapshotCurrentPrintUIImage() -> UIImage? {
                  snapshotLock.lock()
                  guard let tex = snapshotOutputTexture else {
                      snapshotLock.unlock()
                      return nil
                  }
                  let w = tex.width
                  let h = tex.height
                  if w <= 0 || h <= 0 {
                      snapshotLock.unlock()
                      return nil
                  }
                  let bytesPerRow = w * 4
                  let colorSpace = CGColorSpaceCreateDeviceRGB()
                  let bitmapInfo = CGBitmapInfo.byteOrder32Little.rawValue | CGImageAlphaInfo.premultipliedFirst.rawValue
          
                  guard let context = CGContext(
                      data: nil,
                      width: w,
                      height: h,
                      bitsPerComponent: 8,
                      bytesPerRow: bytesPerRow,
                      space: colorSpace,
                      bitmapInfo: bitmapInfo
                  ), let bufferPtr = context.data else {
                      snapshotLock.unlock()
                      return nil
                  }
          
                  tex.getBytes(bufferPtr, bytesPerRow: bytesPerRow, from: MTLRegionMake2D(0, 0, w, h), mipmapLevel: 0)
                  snapshotLock.unlock()
          
                  guard let cgImg = context.makeImage() else { return nil }
                  return UIImage(cgImage: cgImg)
              }
          }
          EOF_HALIDE_FILE

          cat << 'EOF_HALIDE_FILE' > "HalideLabPro/Hardware/MechanicalHapticsAndMotion.swift"
          import Foundation
          import CoreHaptics
          import CoreMotion
          import Combine
          
          /// Synthesizes tactile mechanical camera feedback (Leica/Hasselblad aperture detent clicks,
          /// rangefinder helicoid damping, dual-curtain focal-plane shutter & film advance lever)
          /// and provides a 120Hz 3-axis gyroscope horizon level.
          final class MechanicalHapticsAndMotion: ObservableObject {
              static let shared = MechanicalHapticsAndMotion()
          
              @Published var rollDegrees: Double = 0.0
              @Published var pitchDegrees: Double = 0.0
              @Published var isLevelAligned: Bool = false
          
              private var hapticEngine: CHHapticEngine?
              private let motionManager = CMMotionManager()
          
              private init() {
                  setupHapticEngine()
                  startGyroscopeHorizonUpdates()
              }
          
              private func setupHapticEngine() {
                  guard CHHapticEngine.capabilitiesForHardware().supportsHaptics else { return }
                  do {
                      hapticEngine = try CHHapticEngine()
                      hapticEngine?.playsHapticsOnly = true
                      hapticEngine?.isAutoShutdownEnabled = true
                      try hapticEngine?.start()
                  } catch {
                      print("CoreHaptics initialization warning: \(error.localizedDescription)")
                  }
              }
          
              /// Crisp 1/3-stop anodized metal ball-bearing detent click for Aperture & Shutter Dials
              func playApertureDetentClick(intensity: Float = 0.78, sharpness: Float = 0.92) {
                  guard CHHapticEngine.capabilitiesForHardware().supportsHaptics else { return }
                  let event = CHHapticEvent(
                      eventType: .hapticTransient,
                      parameters: [
                          CHHapticEventParameter(parameterID: .hapticIntensity, value: intensity),
                          CHHapticEventParameter(parameterID: .hapticSharpness, value: sharpness)
                      ],
                      relativeTime: 0
                  )
                  playEvents([event])
              }
          
              /// Subtle damped grease resistance tick for manual focus helicoid ring
              func playFocusHelicoidTick() {
                  playApertureDetentClick(intensity: 0.38, sharpness: 0.45)
              }
          
              /// Two-stage mechanical focal-plane curtain shutter (Front curtain release + exposure delay + Rear curtain thud)
              func playMechanicalShutterRelease(shutterDurationSeconds: Double) {
                  guard CHHapticEngine.capabilitiesForHardware().supportsHaptics else { return }
                  let clampedDelay = min(max(shutterDurationSeconds, 0.012), 1.5)
                  let frontCurtain = CHHapticEvent(
                      eventType: .hapticTransient,
                      parameters: [
                          CHHapticEventParameter(parameterID: .hapticIntensity, value: 0.95),
                          CHHapticEventParameter(parameterID: .hapticSharpness, value: 0.88)
                      ],
                      relativeTime: 0.0
                  )
                  let mirrorDamp = CHHapticEvent(
                      eventType: .hapticContinuous,
                      parameters: [
                          CHHapticEventParameter(parameterID: .hapticIntensity, value: 0.35),
                          CHHapticEventParameter(parameterID: .hapticSharpness, value: 0.25)
                      ],
                      relativeTime: 0.008,
                      duration: 0.035
                  )
                  let rearCurtain = CHHapticEvent(
                      eventType: .hapticTransient,
                      parameters: [
                          CHHapticEventParameter(parameterID: .hapticIntensity, value: 1.0),
                          CHHapticEventParameter(parameterID: .hapticSharpness, value: 0.62)
                      ],
                      relativeTime: clampedDelay
                  )
                  playEvents([frontCurtain, mirrorDamp, rearCurtain])
              }
          
              /// Ratcheting brass gear train sensation when winding the film advance lever
              func playFilmAdvanceLeverWind() {
                  guard CHHapticEngine.capabilitiesForHardware().supportsHaptics else { return }
                  var events: [CHHapticEvent] = []
                  for i in 0..<8 {
                      let t = TimeInterval(i) * 0.032
                      let progress = Float(i) / 7.0
                      let ev = CHHapticEvent(
                          eventType: .hapticTransient,
                          parameters: [
                              CHHapticEventParameter(parameterID: .hapticIntensity, value: 0.45 + 0.45 * progress),
                              CHHapticEventParameter(parameterID: .hapticSharpness, value: 0.70 + 0.25 * progress)
                          ],
                          relativeTime: t
                      )
                      events.append(ev)
                  }
                  playEvents(events)
              }
          
              private func playEvents(_ events: [CHHapticEvent]) {
                  guard let engine = hapticEngine else { return }
                  do {
                      try engine.start()
                      let pattern = try CHHapticPattern(events: events, parameters: [])
                      let player = try engine.makePlayer(with: pattern)
                      try player.start(atTime: CHHapticTimeImmediate)
                  } catch {
                      // Silently ignore if engine is temporarily preempted
                  }
              }
          
              private func startGyroscopeHorizonUpdates() {
                  guard motionManager.isDeviceMotionAvailable else { return }
                  motionManager.deviceMotionUpdateInterval = 1.0 / 60.0
                  motionManager.startDeviceMotionUpdates(to: .main) { [weak self] motion, _ in
                      guard let self = self, let attitude = motion?.attitude else { return }
                      let degRoll = attitude.roll * 180.0 / .pi
                      let degPitch = (attitude.pitch + (.pi / 2.0)) * 180.0 / .pi
                      self.rollDegrees = degRoll
                      self.pitchDegrees = degPitch
                      self.isLevelAligned = abs(degRoll) < 0.8 && abs(degPitch) < 1.2
                  }
              }
          }
          EOF_HALIDE_FILE

          cat << 'EOF_HALIDE_FILE' > "HalideLabPro/Resources/Assets.xcassets/Contents.json"
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF_HALIDE_FILE

          cat << 'EOF_HALIDE_FILE' > "HalideLabPro/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json"
          {
            "images" : [
              {
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF_HALIDE_FILE

          echo "=== Source Tree Synthesized Successfully ==="
          find HalideLabPro project.yml -maxdepth 4

      - name: Select Latest Stable Xcode Toolchain on Runner
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen & Generate HalideLabPro.xcodeproj
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen generate --spec project.yml
          ls -la "${PROJECT_NAME}.xcodeproj"

      - name: Pre-Compile & Verify A15 Bionic Metal Compute Shaders (.metal -> .metallib)
        run: |
          xcrun -sdk iphoneos metal -c \
            -std=ios-metal2.4 \
            -I HalideLabPro/Bridge \
            HalideLabPro/Shaders/AnalogPipelineShaders.metal \
            -o "${RUNNER_TEMP}/AnalogPipelineShaders.air"
          xcrun -sdk iphoneos metallib \
            "${RUNNER_TEMP}/AnalogPipelineShaders.air" \
            -o "${RUNNER_TEMP}/default.metallib"
          ls -lh "${RUNNER_TEMP}/default.metallib"

      - name: Compile iOS App Bundle (arm64 / iPhone 13 Pro Max)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -configuration "${CONFIGURATION}" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO | tee build.log

      - name: Ad-Hoc Sign & Package Installable .ipa
        run: |
          APP_PATH="${DERIVED_DATA_PATH}/Build/Products/${CONFIGURATION}-iphoneos/${PROJECT_NAME}.app"
          codesign --force --deep --sign - --timestamp=none "${APP_PATH}"
          mkdir -p "${RUNNER_TEMP}/ipa_stage/Payload"
          cp -R "${APP_PATH}" "${RUNNER_TEMP}/ipa_stage/Payload/"
          cd "${RUNNER_TEMP}/ipa_stage"
          zip -qry "${GITHUB_WORKSPACE}/${PROJECT_NAME}-${CONFIGURATION}.ipa" Payload
          ls -lh "${GITHUB_WORKSPACE}/${PROJECT_NAME}-${CONFIGURATION}.ipa"

      - name: Upload Build Artifact (GitHub Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: HalideLabPro-${{ env.CONFIGURATION }}-IPA
          path: ${{ github.workspace }}/${{ env.PROJECT_NAME }}-${{ env.CONFIGURATION }}.ipa
          compression-level: 0
          retention-days: 30

      - name: Publish Direct-Download .ipa to GitHub Releases (No-Unzip Direct Install Link)
        if: ${{ inputs.create_github_release != false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
          RELEASE_TITLE="HalideLab Pro iPhone 13 Pro Max Build #${GITHUB_RUN_NUMBER} (${CONFIGURATION})"
          IPA_FILE="${GITHUB_WORKSPACE}/${PROJECT_NAME}-${CONFIGURATION}.ipa"

          gh release create "${TAG_NAME}" "${IPA_FILE}#HalideLabPro-${CONFIGURATION}.ipa" \
            --title "${RELEASE_TITLE}" \
            --notes "Direct-download unsigned/ad-hoc signed \`.ipa\` for iPhone 13 Pro Max. Download \`HalideLabPro-${CONFIGURATION}.ipa\` directly below without unzipping, and install via AltStore, SideStore, TrollStore, or Sideloadly." \
            --latest
