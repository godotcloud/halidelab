          // ============================================================================
          // KERNEL 2: AUTHORITATIVE FILM EMULSION SENSITOMETRY & CHEMICAL DEVELOPMENT
          //           (C1-CONTINUOUS H-D CURVES, RECIPROCITY FAILURE, HALATION,
          //            ARRHENIUS DEVELOPMENT KINETICS, DIR COUPLERS, EBERHARD & 3D GRAIN)
          // ============================================================================
          
          // C-infinity Smooth Hurter-Driffield Characteristic Curve
          // Guarantees exact midpoint density at logH = logH0 and exact derivative dD/d(logH) = gamma at logH = logH0,
          // while allowing independent Toe (x < 0) and Shoulder (x >= 0) roll-off without ANY step discontinuity.
          inline float evalHurterDriffieldLayer(
              float logH,
              float dMin,
              float dMax,
              float gamma,
              float logH0,
              float toeCurvature,
              float shoulderCurvature,
              bool isReversalSlide
          ) {
              float x = logH - logH0;
              float span = max(dMax - dMin, 0.1f);
              float u = (2.0f * gamma / span) * x;
              float c = (x < 0.0f) ? max(toeCurvature, 0.35f) : max(shoulderCurvature, 0.35f);
              float uShaped = u * (1.0f + 0.35f * (1.0f - c) * abs(u)) / (1.0f + 0.25f * (1.0f - c) * u * u);
              float normalizedDensity = 0.5f + 0.5f * tanh(clamp(uShaped, -10.0f, 10.0f));
          
              if (isReversalSlide) {
                  return dMin + span * (1.0f - normalizedDensity);
              } else {
                  return dMin + span * normalizedDensity;
              }
          }
          
          kernel void k_film_emulsion_pass(
              texture2d<float, access::sample> inOpticsLinearTex [[texture(0)]],
              texture2d<float, access::write>  outFilmDensityTex [[texture(1)]],
              constant FilmEmulsionUniforms&   film              [[buffer(0)]],
              uint2 gid                                          [[thread_position_in_grid]]
          ) {
              uint width = outFilmDensityTex.get_width();
              uint height = outFilmDensityTex.get_height();
              if (gid.x >= width || gid.y >= height) return;
          
              constexpr sampler linSampler(coord::normalized, address::clamp_to_edge, filter::linear);
              float2 res = float2(width, height);
              float2 uv = (float2(gid) + 0.5f) / res;
          
              float3 sceneLinear = inOpticsLinearTex.sample(linSampler, uv).rgb;
          
              // 1. Anti-Halation Layer Scatter (Double-Exponential Back-Reflection from Film Base into Red & Green Layers)
              if (film.halationReflectance > 0.001f) {
                  float2 pxStep = 1.0f / res;
                  float redScatter = 0.0f;
                  float weightNorm = 0.0f;
                  const float2 offsets[12] = {
                      float2(1, 0), float2(-1, 0), float2(0, 1), float2(0, -1),
                      float2(0.707f, 0.707f), float2(-0.707f, 0.707f), float2(0.707f, -0.707f), float2(-0.707f, -0.707f),
                      float2(2.2f, 0.0f), float2(-2.2f, 0.0f), float2(0.0f, 2.2f), float2(0.0f, -2.2f)
                  };
                  for (int i = 0; i < 12; ++i) {
                      float2 hUV = uv + offsets[i] * pxStep * film.halationRadiusPixels;
                      float3 sVal = inOpticsLinearTex.sample(linSampler, hUV).rgb;
                      float excessR = max(0.0f, sVal.r - film.halationThreshold);
                      float w = exp(-length(offsets[i]) * 0.80f);
                      redScatter += excessR * w;
                      weightNorm += w;
                  }
                  redScatter /= max(weightNorm, 1e-4f);
                  sceneLinear.r += redScatter * film.halationReflectance;
                  sceneLinear.g += redScatter * film.halationReflectance * film.halationGreenLeak;
              }
          
              // 2. Eberhard Edge Effect / Developer Bromide Drag (Micro-contrast Mackie Lines)
              if (film.eberhardEdgeBoost > 0.001f) {
                  float2 d = 1.25f / res;
                  float3 neighborAvg = 0.25f * (
                      inOpticsLinearTex.sample(linSampler, uv + float2(d.x, 0)).rgb +
                      inOpticsLinearTex.sample(linSampler, uv - float2(d.x, 0)).rgb +
                      inOpticsLinearTex.sample(linSampler, uv + float2(0, d.y)).rgb +
                      inOpticsLinearTex.sample(linSampler, uv - float2(0, d.y)).rgb
                  );
                  float standMultiplier = 1.0f + (1.0f - clamp(film.agitationFactor, 0.2f, 1.2f)) * 0.65f;
                  sceneLinear = max(float3(1e-5f), sceneLinear + (sceneLinear - neighborAvg) * (film.eberhardEdgeBoost * 0.65f) * standMultiplier);
              }
          
              // 3. Spectral Sensitivity Integration (Map ACEScg Linear to R/G/B Emulsion Layer Actinic Exposure)
              float3 layerExposure = max(float3(1e-5f), film.spectralMatrix * sceneLinear);
          
              // Apply Exposure Index (Push/Pull rating compensation)
              float eiRatio = film.exposureIndexRated / max(film.isoNominal, 1.0f);
              layerExposure *= eiRatio;
          
              // 4. Schwarzschild Reciprocity Failure for Long Exposures (t > 1.0s)
              if (film.exposureTimeSeconds > 1.0f) {
                  float3 p = float3(film.reciprocityExponentRGB[0], film.reciprocityExponentRGB[1], film.reciprocityExponentRGB[2]);
                  float3 reciprocityAttenuation = pow(float3(film.exposureTimeSeconds), p - 1.0f);
                  layerExposure *= reciprocityAttenuation;
              }
          
              // Log10 Exposure H = log10(E)
              float3 logH = log10(max(layerExposure, float3(1e-4f)));
          
              // 5. Arrhenius Chemical Development Kinetics (Temperature & Push/Pull Time Effect on Gamma & Fog)
              float standardTempC = (film.processType == FilmProcessBWMonochromeNegative) ? 20.0f :
                                    (film.processType == FilmProcessECN2CinemaNegative ? 41.1f : 37.8f);
              float tempDelta = film.developerTemperatureC - standardTempC;
              float arrheniusRate = exp(0.068f * tempDelta) * film.developmentTimeScale;
              float agitationGammaMod = mix(0.88f, 1.06f, clamp(film.agitationFactor, 0.2f, 1.2f));
              float kineticGammaScale = clamp(arrheniusRate * agitationGammaMod, 0.55f, 2.10f);
              float fogIncrease = max(0.0f, (arrheniusRate - 1.0f) * 0.05f);
          
              bool isReversal = (film.processType == FilmProcessE6ColorReversal);
              float3 densityRGB;
              for (int c = 0; c < 3; ++c) {
                  densityRGB[c] = evalHurterDriffieldLayer(
                      logH[c],
                      film.dMinRGB[c] + fogIncrease,
                      film.dMaxRGB[c],
                      film.gammaRGB[c] * kineticGammaScale,
                      film.logH0RGB[c],
                      film.toeCurvatureRGB[c],
                      film.shoulderCurvatureRGB[c],
                      isReversal
                  );
              }
          
              // 6. DIR (Development Inhibitor Releasing) Couplers Inter-Image Matrix
              // Normalize relative to Green layer midpoint so DIR couplers boost color purity without shifting neutral gray balance
              float3 baseDensity = float3(film.dMinRGB[0], film.dMinRGB[1], film.dMinRGB[2]);
              float3 netDensity = max(float3(0.0f), densityRGB - baseDensity);
              float neutralAnchor = netDensity.g;
              float3 chromaDelta = netDensity - float3(neutralAnchor);
              float3 dirBoostedDelta = film.dirCouplerMatrix * chromaDelta;
              netDensity = max(float3(0.0f), float3(neutralAnchor) + dirBoostedDelta);
          
              // 7. Procedural 3D Monte Carlo Silver Halide Grain (Coupled to Official Diffuse RMS Granularity sigma_D)
              float2 filmMicrons = uv * float2(36000.0f, 24000.0f);
              float cellScale = (film.grainMorphology == GrainMorphologyCubic) ? 0.14f :
                                (film.grainMorphology == GrainMorphologyTabular ? 0.19f : 0.24f);
              float2 grainCoord = filmMicrons * cellScale;
              uint2 cellID = uint2(max(float2(0.0f), floor(grainCoord)));
              float2 cellFract = fract(grainCoord);
          
              float3 grainModulation = float3(0.0f);
              for (int dy = -1; dy <= 1; ++dy) {
                  for (int dx = -1; dx <= 1; ++dx) {
                      uint3 seed = uint3(uint(int(cellID.x) + dx), uint(int(cellID.y) + dy), film.frameRandomSeed);
                      float3 randA = hash33(seed);
                      float3 randB = hash33(seed + uint3(73u, 151u, 313u));
                      float2 crystalPos = float2(dx, dy) + randA.xy - cellFract;
          
                      if (film.grainMorphology == GrainMorphologyTabular) {
                          crystalPos.x *= 0.82f;
                      }
                      float distSq = dot(crystalPos, crystalPos);
                      float kernelEnv = exp(-distSq * 3.8f);
                      float3 crystalPolarity = (randB - 0.5f) * 2.0f;
                      grainModulation += crystalPolarity * kernelEnv;
                  }
              }
          
              // Dye clouds in C-41/E-6 have shared luminance structure with subtle dye-layer micro-variation; B&W is purely monochrome silver
              if (film.processType == FilmProcessBWMonochromeNegative) {
                  grainModulation = float3(grainModulation.g);
              } else {
                  grainModulation = mix(float3(grainModulation.g), grainModulation, 0.28f);
              }
          
              // Selwyn's Law: RMS density fluctuation scales with sqrt(D) and push-processing gamma
              float3 selwynWeight = sqrt(clamp(netDensity, 0.05f, 2.2f));
              float pushGrainPenalty = pow(max(1.0f, kineticGammaScale), 0.55f);
              float rmsScale = (film.diffuseRMSGranularity * 0.0020f) * pushGrainPenalty;
          
              densityRGB = baseDensity + max(float3(0.0f), netDensity + grainModulation * selwynWeight * rmsScale);
          
              outFilmDensityTex.write(float4(densityRGB, 1.0f), gid);
          }
          
          // ============================================================================
          // KERNEL 3: DARKROOM ENLARGER, RA-4 COLOR HEAD, ILFORD MULTIGRADE 00-5 PAPER,
          //           DODGING/BURNING, CHEMICAL TONING & ZONE SYSTEM TELEMETRY
          // ============================================================================
          
          inline float3 zoneSystemFalseColorPalette(int zone) {
              const float3 palette[11] = {
                  float3(0.05f, 0.00f, 0.12f), // Zone 0: Total black (Deep Violet)
                  float3(0.12f, 0.08f, 0.45f), // Zone I: Near black (Indigo)
                  float3(0.05f, 0.28f, 0.78f), // Zone II: Textured black (Cobalt Blue)
                  float3(0.00f, 0.62f, 0.76f), // Zone III: Average dark materials (Cyan)
                  float3(0.10f, 0.68f, 0.38f), // Zone IV: Dark foliage / shadow skin (Teal Green)
                  float3(0.22f, 0.85f, 0.18f), // Zone V: 18% Middle Gray anchor (Pure Green)
                  float3(0.68f, 0.88f, 0.12f), // Zone VI: Caucasian skin / light stone (Lime Yellow)
                  float3(0.98f, 0.82f, 0.05f), // Zone VII: Very light skin / snow with acute side light (Gold Yellow)
                  float3(0.98f, 0.50f, 0.05f), // Zone VIII: Textured white highlights (Orange)
                  float3(0.95f, 0.18f, 0.18f), // Zone IX: Glaring white without texture (Crimson Red)
                  float3(1.00f, 0.85f, 0.96f)  // Zone X: Specular light sources / pure paper base (Magenta White)
              };
              return palette[clamp(zone, 0, 10)];
          }
          
          // Normalizes paper reflection density D_paper into [0..1] linear reflectance between Dmax (deep black) and Dmin (paper white)
          inline float3 paperDensityToNormalizedReflectance(float3 paperDensity, float3 dMinPaper, float3 dMaxPaper) {
              float3 rawRefl = pow(float3(10.0f), -paperDensity);
              float3 minRefl = pow(float3(10.0f), -dMaxPaper);
              float3 maxRefl = pow(float3(10.0f), -dMinPaper);
              return clamp((rawRefl - minRefl) / max(maxRefl - minRefl, float3(1e-4f)), 0.001f, 1.0f);
          }
          
          kernel void k_darkroom_enlarger_print_pass(
              texture2d<float, access::sample> inFilmDensityTex [[texture(0)]],
              texture2d<float, access::sample> inOpticsLinearTex[[texture(1)]],
              texture2d<float, access::write>  outDisplayTex    [[texture(2)]],
              constant PhysicalOpticsUniforms& optics           [[buffer(0)]],
              constant FilmEmulsionUniforms&   film             [[buffer(1)]],
              constant DarkroomPrintUniforms&  darkroom         [[buffer(2)]],
              device ZoneMeterTelemetry*       telemetry        [[buffer(3)]],
              uint2 gid                                         [[thread_position_in_grid]]
          ) {
              uint width = outDisplayTex.get_width();
              uint height = outDisplayTex.get_height();
              if (gid.x >= width || gid.y >= height) return;
          
              constexpr sampler linSampler(coord::normalized, address::clamp_to_edge, filter::linear);
              float2 res = float2(width, height);
              float2 uv = (float2(gid) + 0.5f) / res;
          
              float3 density = inFilmDensityTex.sample(linSampler, uv).rgb;
              float3 dMin = float3(film.dMinRGB[0], film.dMinRGB[1], film.dMinRGB[2]);
              float3 netDensity = max(float3(0.0f), density - dMin);
          
              // 1. Enlarger Callier Effect (Condenser light scattering increases effective negative contrast)
              float callierQ = (darkroom.enlargerHeadType == EnlargerLightCondenser) ? 1.12f : 1.00f;
              netDensity *= callierQ;
          
              // 2. Physical Dodging & Burning (Modulates Enlarger Exposure Time on the Paper Plane)
              float2 dbVec = (uv - darkroom.dodgeBurnCenterUV);
              dbVec.x *= res.x / res.y;
              float dbDist = length(dbVec);
              float dbMask = 1.0f - smoothstep(
                  max(0.01f, darkroom.dodgeBurnRadius - darkroom.dodgeBurnFeather),
                  darkroom.dodgeBurnRadius + darkroom.dodgeBurnFeather,
                  dbDist
              );
              float localPrintEV = darkroom.enlargerExposureTimeEV + dbMask * darkroom.dodgeBurnStops;
              float enlargerTimeGain = exp2(localPrintEV);
          
              float3 dMinPaperVec = float3(darkroom.paperDMinRGB[0], darkroom.paperDMinRGB[1], darkroom.paperDMinRGB[2]);
              float3 dMaxPaperVec = float3(darkroom.paperDMaxRGB[0], darkroom.paperDMaxRGB[1], darkroom.paperDMaxRGB[2]);
              float3 printLinearReflectance;
          
              if (film.processType == FilmProcessE6ColorReversal) {
                  // E-6 Slide Film Projected Directly on Light Table: Transmittance T = 10^(-D)
                  float3 slideMinT = pow(float3(10.0f), -(float3(film.dMaxRGB[0], film.dMaxRGB[1], film.dMaxRGB[2]) - dMin));
                  float3 slideRawT = pow(float3(10.0f), -netDensity) * enlargerTimeGain;
                  printLinearReflectance = clamp((slideRawT - slideMinT) / max(1.0f - slideMinT, float3(1e-4f)), 0.001f, 1.2f);
              } else if (film.processType == FilmProcessBWMonochromeNegative) {
                  // Ilford Multigrade Variable Contrast Paper Engine (Grades 00 to 5 + Split-Grade)
                  float negTransmittance = pow(10.0f, -netDensity.g) * enlargerTimeGain;
                  float logPaperH = log10(max(negTransmittance, 1e-5f));
          
                  // Grade 00 (soft gamma ~ 1.35) to Grade 5 (hard gamma ~ 3.60), calibrated at speed point logH0 = -0.92
                  float gradeNorm = clamp((darkroom.multigradeFilterNumber + 1.0f) / 6.0f, 0.0f, 1.0f);
                  float paperGamma = mix(1.35f, 3.60f, gradeNorm) * darkroom.paperGamma;
                  float dMaxPaper = dMaxPaperVec.g + ((darkroom.chemicalToner == ChemicalTonerSelenium) ? 0.14f : 0.0f);
                  float dMinPaper = dMinPaperVec.g;
          
                  float paperDensity;
                  if (darkroom.enableSplitGrade != 0) {
                      float dSoft = evalHurterDriffieldLayer(logPaperH, dMinPaper, dMaxPaper, 1.40f, -0.92f, 0.65f, 0.70f, false);
                      float dHard = evalHurterDriffieldLayer(logPaperH, dMinPaper, dMaxPaper, 3.45f, -0.92f, 0.48f, 0.52f, false);
                      paperDensity = mix(dHard, dSoft, clamp(darkroom.splitGradeSoftBalance, 0.0f, 1.0f));
                  } else {
                      paperDensity = evalHurterDriffieldLayer(logPaperH, dMinPaper, dMaxPaper, paperGamma, -0.92f, 0.56f, 0.62f, false);
                  }
          
                  float normRefl = paperDensityToNormalizedReflectance(float3(paperDensity), float3(dMinPaper), float3(dMaxPaper)).g;
                  float3 paperBaseTint = pow(float3(10.0f), -(dMinPaperVec - float3(dMinPaper)));
                  printLinearReflectance = normRefl * paperBaseTint;
          
                  // Apply Darkroom Chemical Toners (Selenium / Sepia / Gold)
                  if (darkroom.chemicalToner == ChemicalTonerSelenium) {
                      float shadowWeight = smoothstep(0.6f, 1.9f, paperDensity) * darkroom.tonerIntensity;
                      printLinearReflectance *= mix(float3(1.0f), float3(0.95f, 0.89f, 1.06f), shadowWeight);
                  } else if (darkroom.chemicalToner == ChemicalTonerSepia) {
                      float midWeight = smoothstep(0.25f, 1.45f, paperDensity) * darkroom.tonerIntensity;
                      printLinearReflectance *= mix(float3(1.0f), float3(1.18f, 0.98f, 0.76f), midWeight);
                  } else if (darkroom.chemicalToner == ChemicalTonerGold) {
                      float toneWeight = smoothstep(0.3f, 1.8f, paperDensity) * darkroom.tonerIntensity;
                      printLinearReflectance *= mix(float3(1.0f), float3(0.89f, 0.96f, 1.12f), toneWeight);
                  }
              } else {
                  // RA-4 Color Paper Process (Kodak Endura Premier / Ektacolor Edge with Dichroic Y/M/C Filtration)
                  // Calibrated paper speed point logH0 = -0.92 so 18% Middle Gray on Portra 400 prints at exact 18% reflectance
                  float3 ccShift = float3(
                      -darkroom.filterCyanCC * 0.0025f,
                      -darkroom.filterMagentaCC * 0.0025f,
                      -darkroom.filterYellowCC * 0.0025f
                  );
                  float3 negTransmittance = pow(float3(10.0f), -(netDensity + ccShift)) * enlargerTimeGain;
                  float3 logPaperH = log10(max(negTransmittance, float3(1e-5f)));
          
                  float3 paperDensity;
                  for (int c = 0; c < 3; ++c) {
                      paperDensity[c] = evalHurterDriffieldLayer(
                          logPaperH[c],
                          dMinPaperVec[c],
                          dMaxPaperVec[c],
                          darkroom.paperGamma * 2.42f,
                          -0.92f,
                          0.56f,
                          0.64f,
                          false
                      );
                  }
                  printLinearReflectance = paperDensityToNormalizedReflectance(paperDensity, dMinPaperVec, dMaxPaperVec);
              }
          
              // Convert ACEScg-referred print reflectance to Display P3
              float3 displayLinearP3 = acesCgToLinearP3(printLinearReflectance);
              float3 encodedColor = linearToDisplayP3Gamma(displayLinearP3);
          
              // 3. Ansel Adams Zone System Calculation & Real-World EV100 Spot Telemetry
              float3 sceneLin = inOpticsLinearTex.sample(linSampler, uv).rgb;
              float sceneLuma = max(1e-5f, dot(sceneLin, float3(0.2126f, 0.7152f, 0.0722f)) * (film.exposureIndexRated / max(film.isoNominal, 1.0f)));
              float stopsFromMiddleGray = log2(sceneLuma / 0.18f);
              int zoneIndex = clamp(int(round(stopsFromMiddleGray + 5.0f)), 0, 10);
          
              // Update Telemetry Buffer from the 1-degree Spot Meter Target Pixel
              uint2 spotPx = uint2(clamp(darkroom.spotMeterTargetUV, 0.0f, 0.999f) * res);
              if (gid.x == spotPx.x && gid.y == spotPx.y) {
                  telemetry->spotLinearLuminance = sceneLuma;
                  // Compute true optical EV100 from hardware lens aperture, sensor exposure time, sensor ISO, and spot offset
                  float hwAperture = max(optics.nativeApertureFNumber, 1.0f);
                  float hwShutter = max(optics.realSensorExposureSec, 1.0f / 8000.0f);
                  float hwISO = max(optics.realSensorISO, 25.0f);
                  float baseSceneEV100 = log2((hwAperture * hwAperture) / hwShutter) - log2(hwISO / 100.0f);
                  telemetry->spotEV100 = baseSceneEV100 + stopsFromMiddleGray;
                  telemetry->adamsZoneIndex = zoneIndex;
                  telemetry->filmDensityRGB[0] = density.r;
                  telemetry->filmDensityRGB[1] = density.g;
                  telemetry->filmDensityRGB[2] = density.b;
              }
          
              // Optional Zone System False Color Overlay
              if (darkroom.enableZoneFalseColor != 0) {
                  float3 zoneCol = zoneSystemFalseColorPalette(zoneIndex);
                  encodedColor = mix(encodedColor, zoneCol, 0.78f);
              }
          
              // Optional Focus Peaking Overlay (High-pass Sobel edge detection on linear radiance)
              if (darkroom.enableFocusPeaking != 0) {
                  float2 px = 1.0f / res;
                  float gx = dot(inOpticsLinearTex.sample(linSampler, uv + float2(px.x, 0)).rgb -
                                 inOpticsLinearTex.sample(linSampler, uv - float2(px.x, 0)).rgb, float3(0.333f));
                  float gy = dot(inOpticsLinearTex.sample(linSampler, uv + float2(0, px.y)).rgb -
                                 inOpticsLinearTex.sample(linSampler, uv - float2(0, px.y)).rgb, float3(0.333f));
                  float edgeMag = sqrt(gx * gx + gy * gy);
                  if (edgeMag > 0.18f) {
                      encodedColor = float3(0.10f, 1.00f, 0.45f);
                  }
              }
          
              outDisplayTex.write(float4(encodedColor, 1.0f), gid);
          }
          EOF_HALIDE_FILE

          cat << 'EOF_HALIDE_FILE' > "HalideLabPro/Models/FilmStockDatabase.swift"
          import Foundation
