              float diffuseRMSGranularity;    // Official datasheet sigma_D * 1000 (e.g. 8.0 for Provia, 11.0 for Portra 400, 17.0 for Tri-X 400)
              float eberhardEdgeBoost;        // Developer exhaustion Mackie line micro-contrast boost (0.0 - 0.35)
              float mtf50CyclesPerMM;         // Spatial frequency where MTF drops to 50%
              
              // Darkroom Chemical Development Kinetics (User adjustable)
              float developerTemperatureC;    // e.g. 37.8°C (C-41) or 20.0°C (B&W)
              float developmentTimeScale;     // 1.0 = normal, 1.35 = +1 EV Push, 1.85 = +2 EV Push, 0.75 = -1 EV Pull
              float agitationFactor;          // 0.2 (Stand development: high edge acutance, compressed highlights) to 1.2 (Continuous rotary)
              uint32_t frameRandomSeed;       // Monte Carlo seed per frame for authentic non-static silver halide grain
          };
          
          // Stage 3: Darkroom Enlarger & Photographic Paper Print Uniforms
          struct DarkroomPrintUniforms {
              int32_t enlargerHeadType;       // EnlargerLightCondenser vs EnlargerLightDiffuser
              float enlargerExposureTimeEV;   // Enlarger timer offset in stops (-3.0 to +3.0 EV)
              
              // RA-4 Dichroic Color Head Filtration (0 - 200 CC units)
              float filterYellowCC;
              float filterMagentaCC;
              float filterCyanCC;
              
