          kernel void k_physical_optics_pass(
              texture2d<float, access::sample> inCameraTex     [[texture(0)]],
              texture2d<float, access::sample> inLiDARDepthTex [[texture(1)]],
              texture2d<float, access::write>  outLinearTex    [[texture(2)]],
              constant PhysicalOpticsUniforms& optics          [[buffer(0)]],
              uint2 gid                                        [[thread_position_in_grid]]
          ) {
              uint width = outLinearTex.get_width();
              uint height = outLinearTex.get_height();
              if (gid.x >= width || gid.y >= height) return;
          
              constexpr sampler linSampler(coord::normalized, address::clamp_to_edge, filter::linear);
              float2 res = float2(width, height);
              float2 uv = (float2(gid) + 0.5f) / res;
              float2 centeredUV = (uv - 0.5f) * 2.0f;
              centeredUV.x *= res.x / res.y;
              float radialDist = length(centeredUV);
          
              // 1. Subtle Lateral Chromatic Aberration (Realistic apochromatic lens micro-dispersion)
              float caShift = optics.lateralChromaticAberration * 0.00045f * radialDist;
              float2 uvR = 0.5f + (uv - 0.5f) * (1.0f + caShift);
              float2 uvG = uv;
              float2 uvB = 0.5f + (uv - 0.5f) * (1.0f - caShift * 1.10f);
          
              float3 rawSample;
              rawSample.r = inCameraTex.sample(linSampler, uvR).r;
              rawSample.g = inCameraTex.sample(linSampler, uvG).g;
              rawSample.b = inCameraTex.sample(linSampler, uvB).b;
          
              // Linearize and convert to ACEScg Scene-Linear Radiance
              float3 centerLinear = linearP3ToACEScg(displayP3GammaToLinear(rawSample));
          
              // Smooth, continuous highlight headroom expansion (preserves hue & prevents yellow/white banding)
              float luma = dot(centerLinear, float3(0.2126f, 0.7152f, 0.0722f));
              float highlightGain = 1.0f + 0.65f * luma * luma;
              centerLinear *= highlightGain;
          
              // 2. Physical Thick-Lens Circle of Confusion (CoC) ONLY when real LiDAR/PDAF depth is active
              float3 accumRadiance = centerLinear;
              if (optics.enableLiDARBokeh != 0 && optics.hasValidLiDARDepth != 0) {
                  float depthMeters = inLiDARDepthTex.sample(linSampler, uv).r;
                  if (depthMeters <= 0.02f || isnan(depthMeters) || isinf(depthMeters)) {
                      depthMeters = optics.focusDistanceMeters;
                  }
                  float F = optics.focalLengthMM * 0.001f; // meters
                  float z = clamp(depthMeters, 0.05f, 30.0f);
                  float zFocus = clamp(optics.focusDistanceMeters, 0.05f, 30.0f);
                  float N = max(optics.simulatedApertureFNumber, 0.95f);
          
                  // Exact Gaussian thin/thick lens CoC formula
                  float cocMeters = abs((F * F) / (N * max(zFocus - F, 0.005f)) * ((z - zFocus) / z));
                  // Convert CoC on iPhone 13 Pro Max sensor (sensor width ~ 7.6mm on 26mm Wide) to pixel radius
                  float cocRadiusPx = clamp((cocMeters / 0.0076f) * float(width) * 0.28f, 0.0f, 14.0f);
          
                  if (cocRadiusPx > 1.15f) {
                      const int NUM_TAPS = 24;
                      const float GOLDEN_ANGLE = 2.39996323f;
                      float3 bokehSum = centerLinear * 0.20f;
                      float weightSum = 0.20f;
                      bool isBehindFocus = (z > zFocus);
          
                      for (int i = 0; i < NUM_TAPS; ++i) {
                          float fi = (float(i) + 0.5f) / float(NUM_TAPS);
                          float rNorm = sqrt(fi);
                          float angle = float(i) * GOLDEN_ANGLE;
                          float2 diskDir = float2(cos(angle), sin(angle)) * rNorm;
          
                          // Mechanical Cat's Eye Vignetting: second iris clipping off-axis rays
                          float2 catEyeCenter = centeredUV * optics.opticalVignettingCatEye * 0.50f;
                          if (length(diskDir - catEyeCenter) > 1.10f) continue;
          
                          // Polygonal Diaphragm Blade check
                          float polyW = aperturePolygonWeight(diskDir, optics.apertureBladeCount, optics.bladeCurvature);
                          if (polyW <= 0.01f) continue;
          
                          // Spherical Aberration Ring Boost
                          float saSign = isBehindFocus ? optics.sphericalAberration : -optics.sphericalAberration;
                          float ringFactor = 1.0f + saSign * (rNorm * rNorm - 0.5f) * 1.10f;
                          float onionRing = 1.0f + optics.asphericalOnionRingIntensity * 0.10f * sin(rNorm * 24.0f);
          
                          float2 sampleUV = uv + (diskDir * cocRadiusPx) / res;
                          float sampleDepth = inLiDARDepthTex.sample(linSampler, sampleUV).r;
                          // Bilateral depth weight prevents foreground sharp objects from bleeding into background blur
                          float depthGate = (sampleDepth >= z - 0.12f) ? 1.0f : 0.15f;
          
                          float3 tapSample = linearP3ToACEScg(displayP3GammaToLinear(inCameraTex.sample(linSampler, sampleUV).rgb));
                          float tapLuma = dot(tapSample, float3(0.2126f, 0.7152f, 0.0722f));
                          tapSample *= (1.0f + 0.65f * tapLuma * tapLuma);
          
                          float w = max(0.05f, polyW * ringFactor * onionRing * depthGate);
                          bokehSum += tapSample * w;
                          weightSum += w;
                      }
                      accumRadiance = bokehSum / max(weightSum, 1e-4f);
                  }
